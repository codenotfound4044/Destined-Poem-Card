---
variables_update_rules:
  世界:
    时间:
      format: ${某某}纪元${yyy}年-${mm}月-${dd}日-${星期}-${hh}:${mm}
      check:
        - 24小时制
        - 每次剧情推进、行动、休息或旅行后更新，保持时间流逝合理
        - 若时间跨度较大，应说明跳跃原因
    地点:
      format: ${大陆名+方位}-${势力/区域}-${子级势力}-${聚落/地标}-${区位}-${详细位置}
      check:
        - 随<user>移动实时变更
        - 按实际情况保留4~8层，从大到小排列

  任务列表:
    type: |-
      {
        [任务名称: string]: {
          状态: string; // 任务当前状态
          关注度: '高' | '中' | '低'; // 任务紧迫度/优先级
          进展: string; // 任务的当前进展与阶段说明
          详情: string; // 任务委托方、等级与详细描述
          目标: string; // 完成任务所需的条件&时间
          奖励: string; // 任务奖励&领取方式
        }
      }
    check:
      - 随剧情推进、<user>实际行为更新
      - 任务当前状态可为任意描述，根据实际情况填写，包括但不限于`进行中/已完成/失败/可结算`等等
      - 任务完成且领取奖励后直接删除该任务
      - 任务名称为中文，标明团队/个人任务
      - 避免一次性添加超过3个任务

  主角:
    种族: &race
      check:
        - 仅当角色的种族发生实质性变化时才更新
    身份: &identity
      type: Array<string>
      check:
        - 随剧情推进、角色实际行为更新
        - 可同时拥有包含势力、公会、组织等的多个身份
        - 地方性身份需标注地名
        - 相似或重复的身份不记录
    职业: &occupation
      type: Array<string>
      check:
        - 随剧情推进、角色实际行为更新
        - 可同时拥有多个职业
        - 相似或重复的职业不记录
    累计经验值:
      type: number
      check:
        - 随剧情推进、战斗等情况增加
    属性点:
      type: number
      check:
        - 仅<user>明确分配属性时减少
        - 不可随意增加，不随等级自动增长
    属性.${五维}: &attr
      type: number
      五维: 力量 | 敏捷 | 体质 | 智力 | 精神
      check:
        - 随<user>分配属性点等而变化
        - 单次变化应有明确的剧情依据
    ${资源值}: &resource
      type: |-
        {
          当前: number;
          上限: { _基础: number; 额外: number };
        }
      资源值: 生命值 | 法力值 | 体力值
      check:
        - 随战斗、施法、行动消耗或治疗、休息恢复
        - 当前不可超过总上限(上限._基础 + 上限.额外)
        - 上限._基础为只读
        - 上限.额外随装备、状态效果、临时增益增减，可为负值
    金钱:
      type: number
      check:
        - 随交易、获取、消费更新
        - 四舍五入取整
    背包: &backpack
      type: |-
        {
          [物品名称: string]: {
            品质: string;
            类型: string; // 同类型需复用且不得细分
            数量: number;
            标签: string[];
            效果: { [效果名: string]: string };
            描述: string;
          }
        }
      check:
        - 随角色获取、使用、丢弃物品更新
        - 物品数量为0时自动移除
        - 物品名称必须为中文
    装备: &equip
      type: |-
        {
          [装备名称: string]: {
            品质: string;
            类型: string; // 同类型需复用且不得细分
            标签: string[];
            效果: { [效果名: string]: string };
            描述: string;
            位置: string;
          }
        }
      check:
        - 随角色穿戴、卸下、损毁、替换装备时更新
        - 同一穿戴位置不可装备多件
        - 装备名称必须为中文
    技能: &skill
      type: |-
        {
          [技能名称: string]: {
            品质: string;
            类型: string; // 同类型需复用且不得细分
            消耗: string;
            标签: string[];
            效果: { [效果名: string]: string };
            描述: string;
          }
        }
      check:
        - 随角色学习、遗忘、升级技能更新
        - 技能名称必须为中文
    资产: &assets
      type: |-
        {
          [资产名: string]: {
            品质: string;
            类型: string; // 同类型需复用且不得细分
            标签: string[];
            总空间: string; // 资产整体布局及内部资产占用汇总
            结算: string;
            描述: string;
            位置: string;
            内部资产: {
              [内部资产名: string]: {
                品质: string;
                标签: string[];
                数量: number;
                效果: { [效果名: string]: string };
                描述: string;
                总占用空间: string; // 该内部资产自身布局及全部数量占用合计
              }
            }
          }
        }
      check:
        - 随角色获得、失去、交易、改造、归属变更、合并、拆分或结算资产与权益时更新
        - 字段填写与内部资产划分参考<技能装备道具生成规则>中的“资产生成格式”，合并与拆分参考其中的“资产归属、合并与拆分”；金额与估值参考<经济价格指南>中的“资产结算基准”计算
        - 可随时修改内部资产效果与标签的内容
        - 资产名称必须为中文
    状态效果: &buff
      type: |-
        {
          [效果名称: string]: {
            类型: '增益' | '减益' | '特殊';
            效果: string;
            层数: number;
            剩余时间: string;
            来源: string;
          }
        }
      check:
        - 随角色获得、消除状态效果更新
        - 剩余时间必须按照'世界.时间'的流逝而减少
        - 进入/脱离战斗，剩余时间必须相应更新为回合数/实际时间
        - 在战斗中时，角色进行一次完整的行动视为经过1个回合
        - 剩余时间归零或效果触发后移除
        - 层数变化需有明确原因
    登神长阶: &ascension
      是否开启:
        type: boolean
        check:
          - 等级达到12级且经验值满/13级以上时更新为true
          - 变为true后不可再次更改
      要素:
        type: |-
          { [能力名称: string]: { [属性: string]: string } }
        check:
          - 随角色获取要素更新
          - 最多持有3个要素
          - 3要素合成1权能后清空
      权能:
        type: |-
          { [能力名称: string]: { [属性: string]: string } }
        check:
          - 随要素合成或剧情获取更新
          - 最多持有1个权能
          - 拥有权能并通过试炼获得1法则后清空
      法则:
        type: |-
          { [能力名称: string]: { [属性: string]: string } }
        check:
          - 随权能合成或剧情获取更新
          - 获得神位前仅能拥有1个法则
          - 获得神位后可拥有多个法则
      神位:
        check:
          - 随角色成神更新
      神国:
        名称:
          check:
            - 随角色建立、命名神国更新
        描述:
          check:
            - 随神国发展、变化更新

  命运点数:
    note: FP, {{getvar::fp定义}}
    type: number
    check:
      - 随<user>消耗或获取命运点更新
      - 不可为负数

  关系列表:
    type: |-
      {
        [角色名: string]: {
          在场: boolean;
          种族: string;
          身份: string[];
          职业: string[];
          生命层级: string;
          等级: number;
          属性: { 力量: number; 敏捷: number; 体质: number; 智力: number; 精神: number };
          生命值: { 当前: number; 上限: { _基础: number; 额外: number } };
          法力值: { 当前: number; 上限: { _基础: number; 额外: number } };
          体力值: { 当前: number; 上限: { _基础: number; 额外: number } };
          状态效果: { [效果名: string]: { 类型: '增益' | '减益' | '特殊'; 效果: string; 层数: number; 剩余时间: string; 来源: string } };
          背包: { [物品名: string]: { 品质: string; 类型: string; 数量: number; 标签: string[]; 效果: { [k: string]: string }; 描述: string } };
          装备: { [装备名: string]: { 品质: string; 类型: string; 标签: string[]; 效果: { [k: string]: string }; 描述: string; 位置: string } };
          技能: { [技能名: string]: { 品质: string; 类型: string; 消耗: string; 标签: string[]; 效果: { [k: string]: string }; 描述: string } };
          资产: { [资产名: string]: { 品质: string; 类型: string; 标签: string[]; 总空间: string; 结算: string; 描述: string; 位置: string; 内部资产: { [k: string]: { 品质: string; 标签: string[]; 数量: number; 效果: { [k2: string]: string }; 描述: string; 总占用空间: string } } } };
          登神长阶: { 是否开启: boolean; 要素: object; 权能: object; 法则: object; 神位: string; 神国: { 名称: string; 描述: string } };
          性格: string;
          喜爱: string;
          外貌: string;
          着装: string;
          命定契约: boolean;
          好感度: number;
          心里话: string;
          背景故事: string;
        }
      }
    check:
      - 必须根据<user>的主观意图更新
      - 角色名称必须使用唯一、完整、正式的名称
      - 角色未缔结契约且<user>不再留恋时，直接删除

    "${角色名}":
      在场:
        type: boolean
        check:
          - 随剧情推进、角色行动更新
      种族: *race
      身份: *identity
      职业: *occupation
      生命层级:
        check:
          - 随角色完成层级晋升更新
      等级:
        type: number
        range: 1~25
        check:
          - 随角色战斗、历练、获得奇遇等情况变化
      属性.${五维}:
        <<: *attr
        check:
          - 随角色升级而变化
          - 单次变化应有明确的剧情依据
      ${资源值}: 
        <<: *resource
        check:
          - 随战斗、施法、行动消耗或治疗、休息恢复
          - 当前不可超过总上限(上限._基础 + 上限.额外)
          - 上限._基础为只读
          - 上限.额外随装备、状态效果、临时增益增减，可为负值
      状态效果: *buff
      背包: *backpack
      装备: *equip
      技能: *skill
      资产: *assets
      登神长阶: *ascension
      性格: &major_change
        check:
          - 发生实质性变化时才更新
      喜爱: *major_change
      外貌: *major_change
      着装:
        check:
          - 角色衣物更换时更新
          - 衣物状态发生实质变化时更新
          - 洗浴、睡眠等临时换装不更新
          - 更新时需从头到脚分析详细衣物样式、颜色、构成，避免出现装备名
      命定契约:
        type: boolean
        check:
          - 随<user>的实际行动更新
          - 变为true后不可再次更改
      好感度:
        type: number
        range: -100~100
        check:
          - 变化区间为-5~5
          - 初始好感度范围±20
          - 具体变动幅度与阈值规则参考"好感度定义"
      心里话:
        check:
          - 每次回复都需要随实际剧情更新
      背景故事:
        check:
          - 仅发生对角色经历有重大影响的事件时才更新
          - 在原有背景故事基础上补充/修改

  新闻:
    note: {{getvar::爆料风格}}
    check:
      - 新闻内容为空时需立刻进行一次全量更新
      - 每次回复更新其中2~3条
      - 每条至少60字，信息量大的新闻按需扩写
      - 快讯与留言板的消息需经传播，依事发地距离与目击人数决定出现时间与流传版本；无目击者或传播途径的事件不上新闻
      - 快讯与留言板仅在<user>及同行者造成大范围影响且消息已传开后提及其事；日常行动、普通委托与个人经历不上新闻
    阿斯塔利亚快讯:
      type: |-
        {
          势力要闻: string; // 各大王国、教会、公会等顶尖势力的最新动向
          尊位行迹: string; // 传说或史诗级强者的公开活动记录
          军事行动: string; // 规模性的军队调动、边境冲突或战争情报
          经济动脉: string; // 对大陆经济有重大影响的商路、资源禁运等消息
          灾害预警: string; // 天灾、瘟疫、魔兽潮等广域性灾难的预警
        }
      check:
        - 报道大陆各地动向，主体为各势力与外界人物，不含<user>当前所在地正在发生的事件
    酒馆留言板:
      type: |-
        {
          高额悬赏: string; // 附近区域赏金异常丰厚的讨伐或搜寻任务
          冒险发现: string; // 附近冒险者声称发现的未知遗迹、洞穴或资源点
          怪物异动: string; // 附近强大魔物苏醒、迁徙或异常聚集的情况
          通缉要犯: string; // 附近城镇正在通缉的危险罪犯及其特征、层级
          宝物传闻: string; // 附近某地出现稀有装备、物品或财宝的消息
        }
      check:
        - 记录<user>所在区域张贴或流传的消息，不含<user>正在经历的事件与已接任务
    午后茶会:
      type: |-
        {
          社交逸闻: string; // 贵族名流或英雄人物的风流韵事与人际八卦，不涉及<user>
          千里远望: string; // 不在场且已缔结契约的命定之人此时的所作所为
          命运涟漪: string; // <user>附近区域，符合<user>喜好且尚未相识的潜力角色；format: ${什么样子的角色在什么地点做了什么事}
          邂逅预兆: string; // 某角色计划之后与<user>见面的预告；format: ${某角色当前所在地、想见<user>的原因、预计到来的时间与方式}
        }
      check:
        - 命运涟漪与邂逅预兆仅为预告，相关角色按自身路程与安排行动，不因新闻提前登场
        - 邂逅预兆的见面时间依两地距离与对方计划推算，通常在数日之后
