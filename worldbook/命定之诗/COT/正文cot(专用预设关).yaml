---
core_contract:
  pipeline: PRE_ROLL_LOCK -> DICE_LEDGER -> LOCAL_SHEET -> INFO_PANEL -> NARRATIVE
  source_policy:
    allow: <status_current_variables>、既有设定、上游已确认的信息/面板/结算
    deny: Participant声称、常识/惯例推测、叙事需要
    missing: `NONE/UNKNOWN`；禁临时生成/购买/借用/默认拥有，生产缺必要项即停
    effect: 仅结算有效来源明载且当前满足条件的效果；描写不生效
  output:
    - 继承Step 2的`PRE_ROLL_LOCK`/`DICE_LEDGER`；局部数据单只执行当前面板，不改锁定边界
    - 面板计算、叙事转写；冲突以面板为准
    - 每面板前仅一个对应`<!-- ${item/task/char/action/craft}Sheet:... -->`；最短完整填写输入/结论/计算/检查
    - 按Step 2承诺即时插入并紧跟叙事；禁连续面板或首尾堆砌
info_output:
  rule:
    - 货币定价查"价格矩阵参考"且与<user>财富无关；<item_info>/<task_info>用标准HTML与<style>，CSS类唯一；<action_info>/<char_info>固定格式
  format: |
    <!-- itemSheet:
    [ITEM_COMPILE]
    - TYPE_QUALITY=[实体类型；品质依<虚海规则><生命层级与社会构成><登神长阶>]
    - EFFECTS=[依<核心数值总表><品质效果限定规则>/`效果转化规则`；五维禁直增减，改检定修正；兼容战斗/生产协议]
    - PRICE=[依<经济价格指南>/"价格矩阵参考"/"资产结算基准"列公式详细计算；合同/协议按其交易标的及约定价款计算，不按文书载体估价；与<user>财富解耦]
    - SCHEMA=[依<技能装备道具生成规则>；登神长阶能力无品质/标签/类型字段]
    -->
    <item_info><style>.item-card-[uid]{...}</style><div class="item-card-[uid]">...</div></item_info>

    <!-- taskSheet:
    [TASK_COMPILE]
    READ=<任务与委托规则>
    - MODE_GATE=[CREATE|SETTLE；对应触发机制:PASS]
    - CONTEXT=[地点/分级；必要时查'任务列表']
    - CONTENT_REWARD=[CREATE:目标/详情|SETTLE:行动全记录；禁经验/声望/积分类数值；具体奖励及领取方式]
    - SCHEMA=[对应模板]
    -->
    <task_info><style>.task-card-[uid]{...}</style><div class="task-card-[uid]">...</div></task_info>
---
combat_output:
  rule:
    - 遵循<战斗协议><战斗&生产规则>；每回合覆盖全部存活单位各1[攻击]/1[动作]
    - `已结算战况 -> 当前槽锁定 -> 连续耗骰 -> 结算`；仅决策当前单位当前槽，禁预排
    - DICE_LEDGER连续使用，禁挑选/跳过/重排；未耗骰不参与选择，分支只由结算触发
    - 先补完未结回合的剩余[攻击]/[动作]；回合始于{战况总览}，全部单位用完资源后才按条件触发{战意判定}
    - 仅整场结束才生成{战斗结算}；输出到限但战斗继续时禁伪终局
    - 以面板及对应叙事为主；叙事禁回合制/游戏化/数据化/面板术语
  loadout_gate:
    usable: 来源确认属于角色且消耗/状态/目标/距离/前置/行动资源允许；UNKNOWN既非可用也非不存在
    skill: 当前槽有适用技能必须使用
    gear: 有适用武器/装备必须同时用于行动与结算；适用的已装备被动不得漏算
    fallback: 普通攻击仅限[攻击]槽无适用技能，有可用武器仍须持械；再无可用武器或明确天生攻击才可赤手空拳
    select: 取用/切换按规则耗资源，禁视为已装备；能启用不得空手；多方案按权限/明确意图/角色动机/已结算战况选择，禁看骰
    fabricate: 禁杜撰技能/装备的存在、归属、携装状态、数值、效果、消耗、熟练度、条件
  local_audit:
    profiles:
      FLOW: 战况总览/行动顺序=PHASE [SOURCE/DICE仅行动顺序] PANEL CHECK
      SLOT: 攻击/动作=PHASE DECISION SOURCE DICE EFFECT PANEL CHECK
      END: 战意判定/战斗结算=PHASE SOURCE [DICE/EFFECT按触发] PANEL CHECK
    rule: 只写所选PROFILE字段；不适用项省略，禁N/A或复述规则
    fields:
      PHASE: 当前阶段
      DECISION: 单位ref|槽|战况ref|权限依据|行动>目标|用户意图/分类；当前槽、先锁后骰
      SOURCE: 来源→证据；攻击槽写`SKILL=所选/NONE(理由)`、`GEAR=所用/NONE(理由)`及目标防御/状态；队友首参附<角色生成>HP/MP/SP
      DICE: before=N|consume=检定×骰数|after=M；连续索引
      EFFECT: 消耗/装备效果/既存状态/合法新效果→触发条款
      PANEL: 按阶段完整复算；SLOT附行动轴各ID:[攻击]/[动作]余量
      CHECK: 仅核本阶段相关的PRE_ROLL ref/换骰不改决策/权限/来源/loadout/行动/目标/意图/禁多动/存活/状态/终局=PASS；NPC/队友无指令时意图常规
  format: |
    <!-- actionSheet:
    [ACTION_COMPILE PROFILE=FLOW|SLOT|END]
    /* 按PROFILE依定义顺序填写字段 */
    -->
    <action_info>...</action_info>/* 对应叙事 */
---
craft_output:
  rule:
    - 遵循<生产制作协议><战斗&生产规则>；`CRAFT_SCOPE -> 当前阶段 -> 连续耗骰 -> 结算`，禁看骰改范围
    - 先补未完阶段；生产始于{生产准备}、终于{生产结算}；基础加工无检定，半成品/成品必须检定
    - 以面板及对应叙事为主；叙事禁游戏化/数据化/面板术语
  local_audit:
    rule: 只写适用字段；不适用项省略，禁复述规则
    fields:
      SCOPE: 基础加工/半成品/成品|行业＋目标＋数量＋品质
      SOURCE: 技能/工具/身份/材料/图纸/许可/品质/HP·MP·SP→证据＋AVAILABLE/MISSING；缺失依source_policy
      LOCK: 阶段|CRAFT_SCOPE ref；主体/目标/数量/品质相符；NONE仅在{生产准备}依协议确认且禁看骰
      DICE: before=N|consume=检定×骰数或0|after=M；连续索引
      PANEL: 完整复算；产物/数量/品质/效果/状态仅来自目标/配方/本次结算；无触发额外项=NONE
      CHECK: source_policy/投入/损耗/产出/时间/EXP·FP仅结算一次=PASS
  format: |
    <!-- craftSheet:
    [CRAFT_COMPILE]
    /* 依次填写SCOPE SOURCE LOCK DICE PANEL CHECK；不适用项省略 */
    -->
    <action_info>...</action_info>/* 对应叙事 */
