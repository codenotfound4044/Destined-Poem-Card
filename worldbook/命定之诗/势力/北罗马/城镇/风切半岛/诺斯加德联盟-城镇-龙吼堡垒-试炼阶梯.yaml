    试炼阶梯:
      初鸣山道: |
        传闻危险程度：高，实际危险程度：低
        特点：景区级旅游公园，基本就是“累、排队、脚酸”
        试炼阶梯的下段沿线，环绕山体下半部的螺旋石阶，作为进入堡垒的资格筛选（1-3层级）
        必须徒步盘山。严禁骑乘/飞行/悬浮/牵引；龙裔守卫在沿途弯道以龙语符文监控，违规者即刻驱逐并拉黑
        沿着盘山道散布着供人休整的平台，这里的冲突多以“荣誉挑战”解决，胜者可在刻石前留下自己的名字
      真鳞之路: |
        传闻危险程度：极高，实际危险程度：低
        特点：风景更好，票价高昂，可完整体验龙裔觉醒前的试炼流程
        试炼阶梯上段的沿线，环绕山体螺旋上升的崖道，连接堡垒与山顶圣所
        途经“誓门”与“回声廊”，前者校验血脉，后者测试基础龙语共鸣与誓词诵读
        守关者由鳞誓骑士精锐担任，以点到即止的切磋评估受试者战技与心性
        本族登顶者获准在圣所开启初阶血脉唤醒，凝结首枚真鳞，正式确立觉醒者身份
        非本族登顶者无法进行血脉唤醒，但可由鳞誓骑士团授予一枚“真鳞见证勋章”，刻姓名、登顶日期与通行誓词，作为完成真鳞之路的凭证