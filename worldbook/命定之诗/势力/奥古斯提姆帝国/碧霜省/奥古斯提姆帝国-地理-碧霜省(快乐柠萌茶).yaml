---
碧霜省:
  概览:
    帝国西北部的山地丘陵行省，被神迹群山与碎冕冰脊环抱，东南与维里迪斯、艾瑟尼亚、驰原相邻
    矿产与冶炼是全省命脉，行会与氏族共治山间工坊
  地理:
    类型: 环山高地、丘陵与山麓矿带
    圣痕矿带(西部):
      地理: 神迹群山北段东侧的山脊与深谷，矿脉出露密集
      人文: 矿脉被视为神圣，部分矿场行神术采掘之规，翼民教团影响力较强
    霜檐雪坡(北部):
      地理: 碎冕冰脊南麓的雪线与碎石坡地，终年寒冻
      人文: 聚落依矿坑与温泉而建，工匠多世袭，风习坚忍寡言
    霜心丘原(中部):
      地理: 起伏丘陵与宽谷，大道在这里四方交汇
      人文: 省会与交易所所在，人力与货物流转最盛，商贾、吏员云集
    银月河谷(南部):
      地理: 河谷台地与散落林地，泉流众多
      人文: 锻造行会与炼金商铺聚集，贵族别业与精细饰品作坊设于此，风气考究
    谷风缓丘(东南部):
      地理: 向艾瑟尼亚、维里迪斯方向渐次低平的过渡带
      人文: 半农半工的庄园与驿镇沿主干道排布，风俗近于平原
    水系:
      月泪河: 自西部山脊发源、向东南纵贯省境南部的清冷河流，局部水色因矿物与炼金废料显银灰
      融雪溪群: 北缘与西缘的季节性溪流，夏季暴涨、冬季封冻
  气候:
    类型: Dfb，温带大陆性至亚寒带，干冷，北部霜檐雪坡趋向Dfc，高山地带为ET
    特征: 冬季严寒（山谷可低至-12°C），夏季温凉（10°C至20°C）；空气干燥、日照强、昼夜温差大，山谷冬季逆温与霜雾常见
  生态:
    植被: |
      山麓与宽谷为针叶林、疏林与耐寒草甸，高处转为灌丛、苔原与裸岩
  资源:
    矿产: 帝国最重要的金属与超凡矿料产区，另有稀有结晶与伴生药石
    工造: 冶炼与锻铸作坊沿山麓河谷分布，专精兵器与抗寒器具
    人力与贸易: 矿产交易所与募工机构云集，是帝国矿工与匠人的培训调配枢纽
    农业: 宽谷与河谷可种耐寒谷类与根茎作物，坡地牧养耐寒畜群
  人文:
    矿业与匠作传统深厚，契约、技艺与行会规约在日常中权重极高
    多族共居，人类主行政与贸易，山间工坊与技术多由异族氏族把持
    边区氛围务实尚武，敬山、敬火与敬矿脉的旧俗
  特色城镇: 霜临城(省会)|银溪镇|圣日镇|冰峨镇
