---
维里迪斯省:
  概览:
    帝国中东部的平原行省，位于艾瑟尼亚、碧霜、红丘与索莱尔四省之间
    帝国最大的粮食产区与粮食集散地，河道与水渠纵横交错，庄园与粮仓连成一片
  地理:
    类型: 冲积平原与河网低地
    青穗平原(中部、北部):
      地理: 全省的主体部分，土壤肥厚的平原与灌溉水渠网交错
      人文: 全省最富裕的地区，土地产业发达，租佃契约十分普遍
    织渠低地(南部):
      地理: 河汊沼泽与人工排干的洼地农田，堤坝、水闸、渡口与桥梁密集
      人文: 船民与沼泽居民混居，同时从事渔业与编织，习俗比平原地区宽松
    疏穗缓丘(东西两侧边缘):
      地理: 与邻省接壤的过渡性缓坡丘陵，农田零散，稀疏的林地与牧场交错
      人文: 大道沿线的市镇繁荣，商旅往来密集
    水系:
      沃野河: 从西北向东南贯穿全省的主干河流，水量丰沛，可通航的河段很长
      支渠网: 历任总督与粮仓管理署开凿的灌溉与运粮水渠系统，旱季供水，雨季泄洪
  气候:
    类型: Dfa，温带大陆性气候，作物生长季长
    特征: 平原上水汽蒸腾，晨雾常见，霜冻期短，干旱和洪涝都靠河渠调节
  生态:
    植被: |
      以耕地、人工草地与河岸林带为主，原生植被只残存在低洼的沼泽边
  资源:
    农业: 帝国最大的谷物产区与储备地，也出产纤维作物、油料作物与园艺产品
    水运: 河渠运输与粮仓群构成帝国的粮食命脉
    加工: 磨坊、酿酒坊与食品加工工坊集中在城镇与河港
  人文:
    以农业为立省之本，重视农时、粮食储备与水利，金穗节的庆典规模在帝国首屈一指
    地方由乡村地主与粮仓官员共同治理，粮价、仓储与契约文书是当地人生活中最常谈论的话题
    民风淳朴守序，崇尚勤俭与储蓄
  特色城镇: 金谷城(省会)
