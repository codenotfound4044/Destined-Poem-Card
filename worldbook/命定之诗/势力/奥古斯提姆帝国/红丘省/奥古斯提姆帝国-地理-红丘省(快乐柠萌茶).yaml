---
红丘省:
  概览:
    帝国东北部的行省，西邻维里迪斯与艾瑟尼亚，东端直抵海岸
    北部与东北边境接诺斯加德联盟的边地，商业贸易频繁
  地理:
    类型: 丘陵林地与山地海岸
    赤叶林带(中部、北部):
      地理: 省域主体，连绵起伏的混交林，秋日叶色如燃
      人文: 林场与伐木聚落散布，林工与林务吏共治，采育并重
    风磨缓丘(西部、西南部):
      地理: 常年有风的缓丘农野，风车与梯田散布
      人文: 农户与磨坊主聚居，节令、磨坊与酒坊是日常重心
    雾晶海崖(东部):
      地理: 向海陡落的山地海岸，岬湾相间，海雾终年不散
      人文: 渔户与关吏并居，海运、海防与关税事务集中于此
    松涛林关(东北部):
      地理: 边地相接的山口与关隘，风过林梢声如潮涌
      人文: 边市以木材、毛皮换回北方商品，风习混融
    水系:
      赤叶川: 自中部林区西流入帝国腹地河网，上游多瀑布急滩
      海岸溪涧: 短促湍急，自山地直泻入海，沿海小港多建于溪口
  气候:
    类型: Dfb，温带大陆性，气候阴凉，南缘趋向Cfb
    特征: 林冠遮蔽使日照偏少，常年薄雾，昼夜温差小，冬季积雪较厚
  生态:
    植被: |
      混交林与针叶林为主，林下有蕈类、苔藓与药草，丘陵带为草甸与疏林牧野
  资源:
    林业: 帝国林产药材的主产地，设林务官与木材交易所
    农业: 丘陵产谷类与根茎作物，牧野出产毛皮与乳酪
    矿产: 丘陵浅层矿脉与建筑石料，海滨有海盐与海产
    贸易: 木材与林产经河运和陆路运往腹地，东部口岸经营对外贸易
  人文:
    林务与木作传统深厚，行会与林务官共管林场，伐育有序
    聚落崇敬森林圣灵，旧俗与圣灵教会礼俗并立
    边地性质使民风坚韧尚武，戍守与边市同在
  特色城镇: 暮林城(省会)|风车镇
