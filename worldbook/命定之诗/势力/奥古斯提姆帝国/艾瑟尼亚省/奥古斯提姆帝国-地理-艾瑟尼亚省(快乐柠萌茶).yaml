---
艾瑟尼亚省:
  概览:
    首都艾瑟嘉德坐落在省中部一片比周围高出许多的隆起台地上
    帝国的礼仪、学术与工艺制造中心，官员、贵族与学者最集中的地方
  地理:
    类型: 中部台地与四周的缓坡平原
    辉光台地(中部):
      地理: 全省核心的隆起高地，首都与周边卫星聚落都建在上面，台地边缘大多是断崖和层层叠叠的拱廊通道
      人文: 最讲究家世与礼仪排场，官员、学者与贵族在这里往来交织
    白垣丘原(北部):
      地理: 浅色岩层出露的低缓丘陵
      人文: 采石场与隐修院散布其间，学者与朝圣者往来不断，风气简朴虔诚
    碧野低原(东南部):
      地理: 向维里迪斯省、索莱尔省方向延伸的平坦农田，沟渠相连
      人文: 为首都供应农产品和手工业品的地带，庄园与市集秩序井然
    猎风林丘(西部):
      地理: 与驰原省交界处林木稀疏的缓坡丘陵，风比较大
      人文: 猎场与林务哨所散布，民风粗犷豪爽，与西边的军事城镇贸易频繁
    雾渡缓野(南部):
      地理: 与辰钟省湿地相接的低平地带，水汽弥漫、渡口密集
      人文: 旅客与货物转运频繁，聚落大多同时经营渡船运输
    水系:
      辉光川: 发源于台地北缘的涌泉，绕过台地东、南两侧山脚后流入东南平原，中下游可通航
      跃水渠网: 帝国工务院主持修建的引水与落差渠道系统，为首都和近郊供水，并驱动工坊的水车
  气候:
    类型: Dfa，温带大陆性，四季分明
    特征: 台地高出四周平原，夏季较凉爽、冬季日照充足
  生态:
    植被: |
      台地与丘陵以人工林带、果园与修剪过的草场为主
      低地平原是连片的耕地与河岸草甸，零星残存着原生的稀疏阔叶林
  资源:
    农业: 谷类与根茎作物，近郊供应型农业发达
    矿产: 建筑石料与烧制用料，深层有零星贵重矿脉
    工艺: 皇家工坊与各行业公会总部云集，精密工艺、炼金与符文制品在帝国首屈一指
    学术: 最高学府与各大协会所在地，人才与藏书储备居帝国之首
  人文:
    贵族用学历、军功与宫廷头衔彰显身份，官僚体系规矩森严，礼仪规范渗透到日常生活中
    公共仪式以圣灵教会为主流，法律上信仰自由，地方信仰并存
  特色城镇: 艾瑟嘉德(首都)|白石镇
