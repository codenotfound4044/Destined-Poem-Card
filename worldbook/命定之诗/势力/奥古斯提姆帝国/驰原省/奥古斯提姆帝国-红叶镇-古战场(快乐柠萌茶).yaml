---
红叶镇-古战场:
  概述:
    位置: 奥古斯提姆帝国-驰原省-红叶镇南郊
    面积: 约120km²
    性质: 第二次位面交汇战争的战役遗址，裂隙残痕至今未闭合的高危冒险区域
  通用机制:
    血色残阳: 秋季黄昏整片战场被染成血色，亡者残影浮现并重演厮杀幻象，期间所有[精神]检定-2
    时间黏滞: 中环以内指南针与计时法器失效，无法确认外界时间
  区域划分:
    外围-花海:
      环境: 野花与红枫覆盖旧日阵地，宁静如郊野，一台崭新的白色魔导巨炮废弃在远处，每日自检
      特殊地点:
        花海
        废弃魔导巨炮
        公会哨塔(补给与撤离点)
      主要危险:
        少量魔物(一或二层级)
        魔导巨炮(第四层级/史诗)
    中环-黑云废墟:
      环境: 黑云如屏障笼罩，与外界花海彻底隔断；内部昏暗，残破建筑、战争兵器与尸骨层层堆叠，数百年毫无变化
      特殊地点:
        断戟壁垒
        白骨河床
        联军指挥所废墟
      特殊机制:
        云盖隔断: 越过云盖后，与外界的传讯、定位与召唤全部失效
      主要危险:
        骸骨兵(第二层级): 穿着铠甲的异域或联军尸骸，在互相战斗
        战怨聚合体(第二层级): 由大量战死者怨念凝成的巨像
        遗留兵器(第二层级): 仍运转的构造体与魔导炮无差别攻击所有活物
        联军骑士/异域精英(第三层级): 游荡于指挥所废墟，保留生前战技，在不知疲倦的战斗
    深处-双剑镇眼:
      环境: 古战场的最中心，黑白两柄巨剑交错插于地面，永无止境地斩杀异界生物，无数强大的联军军官和异域大魔的尸骸如森林般诡异站立，遍布各处
      特殊地点:
        双剑镇眼
        裂隙残痕
        无名墓碑园
      特殊机制:
        裂隙低语: 靠近裂隙需[DC16 精神]检定，失败则被双剑崩飞出去
        拔剑: 拔剑将解除镇压，战场进入崩解状态(极高危区域事件)
      主要危险:
        剑灵·黑与白(第四层级): 双剑遵循旧主的意志，不断斩杀异域生物，吸收能量增强存在
        蚀界残余(第四层级): 每段时间从裂隙渗出的异界生物，出现后便与双剑战斗
  产出:
    采集: 优-稀_材料(中环)/优-稀_异域/联军装备(中环)
    探索: 史_剑灵(深处)