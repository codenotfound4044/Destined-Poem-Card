---
红叶镇:
  位置: 奥古斯提姆帝国-驰原省东部
  规模: 小型村镇
  人口构成: 人类84%|精灵6%|兽族9%(商品/奴隶/旅客)|翼民1%(宗教)|其他
  环境:
    气候: Cfb，西风末梢的温和湿润气候，四季分明，夏凉冬润，秋多霜雾，枫期漫长
    风貌: 红枫掩映的温和小镇，枫林与草甸农田交错，大道横穿小镇，驿马与商队往来不断
    布局: 沿着十字形大道向四周铺开成圆形，外围围着木栅栏和浅壕沟
  概况: 艾瑟嘉德(东)、时钟塔城(南)、铁炉堡(西)三座城市的中途小镇，冒险者聚集地，商队络绎不绝
  资源:
    采集:
      稀_材料/异界装备(古战场)
    探索:
      史_奖励(古战场深处，极低概率)
    制造:
      优_装备(锻造工坊)/药剂(炼金商店)
    教育:
      稀_魔法(魔法协会)
      优_炼金术(书店)
    交易:
      稀_物品(集市/旅商)
  地点: 魔法协会/炼金商店/锻造工坊/黑市/冒险者公会
  特殊地点:
    古战场(南郊): 荒芜的平原述说着第二次位面交汇战争的悲怆，魔物在废墟间和古战场深处游荡
    集市: 冒险者出售战利品的露天市场，也是旅商停靠点
    梦境神爱梅斯教堂: 宛如林间秘境般的无人教堂，无任何神职人员值守，属本地信仰
    赤枫堡: 临近古战场的小型碉堡群，看守古战场并兼作小镇的行政中枢
  任务层级: B级(最高)/A级(古战场深处)
  生命层级: 3(赤枫堡)/3(冒险者公会)