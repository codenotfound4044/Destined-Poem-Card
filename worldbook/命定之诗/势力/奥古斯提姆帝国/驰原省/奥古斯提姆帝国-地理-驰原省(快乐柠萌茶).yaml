---
驰原省:
  概览:
    帝国西部的边地行省，西面临恒风草原的兽族联盟，东接艾瑟尼亚与辰钟省，北连碧霜省
    疏木草原覆盖广，军事前哨林立，是帝国最重要的陆上防线
  地理:
    长风旷原(中部、西部):
      地理: 省域主体，平缓起伏的疏林草原，草甸与孤林相间，长年西风不息
      人文: 牧场、军屯与驿镇连缀，屯卒与牧户混居，重骑术与械斗之能
    铁砧山带(西北部):
      地理: 险峻山地与深谷，要塞、矿场与冶炼工场集中
      人文: 帝国军工心脏，匠户与军眷聚居，秩序森严
    琥珀丘陵(东部):
      地理: 缓丘与宽谷相间的开阔地带，气候温润、草木丰茂，枫林、草甸与农田交错，秋来层林尽染如琥珀
      人文: 冒险者与公会哨塔随之聚集，猎场经济与丧葬旧俗并存
    烽燧边地(西缘):
      地理: 沿边境分布的戍堡、烽燧与军屯带
      人文: 戍卒世代守边，气氛常年紧绷，互市亦在此进行
    水系:
      白金河: 自神迹群山南麓向东南斜贯省域，沿岸是主要农耕与军屯区
      边地井泉群: 旷原上人工开凿的井泉与蓄水塘，是沿途大道与边防驻军的生命线
  气候:
    类型: BSk，温带半干旱草原向半湿润过渡，中部、东部趋向Cfb
  资源:
    矿产: 山带的金属与魔法矿料，供给帝国最大的冶炼与军工体系
    农牧: 旷原放牧耐风耐旱畜群，河谷与军屯区种植谷类作物
    军需: 军械、甲具与魔导军器的产区，仓储与驿运网络发达
  人文:
    以军立省，军屯、戍守与边市三位一体，军职与战功是晋升正途
    民风刚健尚武，崇尚骑射、荣誉与誓言，平民多兼屯卒身份
    西境互市与使团往来不断，边地语言与习俗相互渗透
  特色城镇: 铁炉堡(省会)|红叶镇
