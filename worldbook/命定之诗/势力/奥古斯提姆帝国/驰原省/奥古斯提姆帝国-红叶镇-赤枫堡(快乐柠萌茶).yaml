红叶镇-赤枫堡:
  名称: 赤枫堡
  位置: 红叶镇南郊
  概况: 五座石塔呈枫叶状弧线面向古战场；守备官既是驻军指挥，也是镇长
  环境:
    赭红夯石垒成的低矮堡群，墙头遍插军旗，秋季枫红压过雉堞
    堡外深壕环绕，壕底积水映着红叶，壕内密布削尖的拒马木桩
  区划:
    枫门楼(北): 朝向小镇的正门，附设登记处与税务站
    阅兵场(中庭): 石板铺就的中央庭院，操练、集结、点兵
    政务厅(主堡一层): 处理军务与民政，两侧为长官办公室、户籍档室与税金库
    审判庭(主堡西侧): 审讯与裁决之所，地下为拘留所
    长风营(东翼): 兵舍、军械库、马厩与伙房，与政务厅仅隔一道墙
    补给区(西翼): 粮仓、水井、铁匠铺与医务室
    三叶垛(南侧): 弧线排开的三座箭塔，落日塔(瞭望、烽火与报时钟)/银钉塔(弩炮与箭矢库)/旧旗塔(阵亡名录与祭室)
  规范: 堡墙之内禁绝私斗
  联络: 整点撞钟，为在古战场中丧失时间感的人提供方位参照
  层级:
    驻军普遍第二层级，各队长第三层级
    守备少将第三层级，由驰原省委任，一人兼理军政两端