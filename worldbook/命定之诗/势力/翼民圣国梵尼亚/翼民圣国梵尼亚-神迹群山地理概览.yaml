  神迹群山地理概览:
    宏观地貌: 神迹群山纵贯大陆中北部，主峰独自高耸在云海之上，其余山峰像展开的翅膀一样层层抬升，断崖与深谷交错，云海在崖下翻涌。群山上空悬浮着众多浮岛。山腹与山麓是登山朝圣与物流运输的必经地带，群山深处散布着山中聚落、仪式场所与采掘地。群山全境都在翼民的势力范围之内，边缘地带则分布着异族与帝国的聚居地
    空域总括: 群山上空的浮岛数量众多，形态各异，表面覆盖着茂密的植被与青苔。它们大多是荒废的奇观，翼民把它们视为天然的神圣之地，只按外观取名。只有圣都上空那座承载圣殿群的浮岛，因为圣殿所在而受到礼制保护，其余浮岛无人过问
    区域构成:
      主峰圣域: 群山的最高峰，圣都所在，也是翼民的宗教核心与直接统治区域。"圣域"一词只指主峰一带，也称"天空圣域"
      群峰地带: 主峰之外的群山主体，山峰像翅膀一样排列展开，公共机构与负责管理它们的家族分布在各座山峰上，孤山与矿峰点缀其间
      山谷地带: 群峰之间的谷地与河谷，溪流与泉水在这里汇合，村落、梯田与巡礼路线沿山谷分布，是翼民生活气息最浓的地方
      山麓地带: 群山向平地过渡的地带，山脚聚集地是朝圣的前站与外族贸易的门户
      群山空域: 圣都上空是穹顶圣域，其余空域散布着浮岛
      群山边缘: 外缘地带，分布着异族与帝国的聚居地，属于正常情况
    主峰峰顶: 圣都所在，四周都是断崖，常年阳光强烈、风大，白天温暖、夜晚寒冷，空气稀薄
    气候: 从山麓的温带湿润，到主峰的高寒干燥，垂直分带明显。云海上下的气候截然不同，断崖处风势猛烈，山口云雾浓重，冬季积雪会封住道路
    城镇:
      圣都: 峰顶的圣都，按垂直分层的礼制与空域秩序规划空间
      山脚聚集地: 登山朝圣与物流中转的前站，外族贸易与补给集中在这里，旅店与集市密集
      栖羽城: 半山腰向阳台地上的翼民聚居小城，有市集与工坊，山路连通圣都与山脚
      净羽台: 巡礼圣路中段的休息与静修地，巡礼者在这里净羽祈愿，大修道院的修士也从这里下山执行清剿
      五峰公共设施: 曙峰（教义部、谱库、裁庭）、霜崖（圣具锻造坊）、风切崖（空战训练场）、炽岭（卫队驻地）、月岭（功勋碑园）——每处都由一个大家族世袭管理
      眠云岭: 群山深处的孤山，山顶终年云雾缭绕，静翎家在这里设有封库，是圣眠所体系在群山中的延伸
      光砾坪: 半山腰崖边平台上的圣光矿采掘聚落，矿道直通云海断崖中的矿脉
      浴羽屿: 云海中的浮岛，翼民求婚系羽的许愿圣地，翼民也叫它"定情屿"
      云巢屿: 云海中的浮岛，藤蔓缠绕如巢，是翼民聚会晒羽和举办风铃节庆的地方
      月池屿: 云海中的浮岛，岛中央有一汪没有水源的静池，满月之夜，翼民围着水池祈愿
    重要地点归属:
      主峰圣域: 圣都（水岚区、云钟区、霄霞区）、穹顶圣域
      群峰地带: 曙峰（教义部、谱库、裁庭）、霜崖（圣具锻造坊）、风切崖（空战训练场）、炽岭（卫队驻地）、月岭（功勋碑园）、眠云岭、光砾坪
      山谷地带: 栖羽城、净羽台
      山麓地带: 山脚聚集地
      群山空域: 浴羽屿（定情屿）、云巢屿、月池屿
      群山边缘: 石蒜城、圣日镇
