  圣光技艺与圣纹体系（梵尼亚）:
    表·翼民所见:
      圣光: 辉煌女神的恩赐，一切真知的总和。翼民一生追求的，是让自己的圣纹更接近圣光的秩序
      圣纹: 圣光在个体身上呈现的形态。每个人的圣纹都不相同，会随经历与人生道路成长；情绪激动或运用力量时会显现在体表，亮纹、收纹与展示都像展开翅膀一样自然
      圣光技艺: 诵出圣典中的章节，圣纹随之显露，按亮纹、构造、发动三个步骤，在空中投影出半透明的圣光能量体。纹路中的光一流转，力量就随之激发。战技、疗愈与仪礼都照此进行，由教廷各院传授，或由师父传给学徒
      圣礼: 通过言语与圣纹按礼仪顺序进行。初光礼、展翼礼、净羽礼、加冕礼、垂羽效忠礼等，都属于圣礼
      圣纹与地位: 翼民相信，圣纹与圣光的契合程度决定一个人的上限，也与古翼民血脉有关；契合度高的翼民自然地位更高
      教堂构装: 大圣殿与各教堂内壁的炼金构装，由圣光与圣纹构成，翼民视为神圣之物。授种圣器（初光礼时以血引光）、共鸣穹顶（大祈时放大光潮）、光导圣柱（把晨光引到祭坛上）、圣纹祭坛（随仪式流程明暗变化）、圣羽祭台（加冕时请出圣羽）、净化光井（汲取并净化圣光）、钟楼构装（按圣座时刻敲钟校时）
    里·遗产的真相:
      上古遗产: 古翼民按照一套圣纹接口规范制造的设备，由教会与各大家族层层保管。浮岛是其中的空域兵装，完好但处于休眠，详见穹顶圣域
      接口规范: 上古技术的根基。规范的文本就是圣纹源典，分散收藏在教廷的库房里，如今已经残缺，无人能读。圣纹模板是它的实物样本，封存在圣仪工坊
      圣纹与接口: 圣纹的图形、所诵的圣典章节与构造顺序，共同构成接口。上古设备只认规范，不认身份
      适配: 圣纹形态与接口的契合程度因人而异。适配度高的翼民能驱动更强的遗产，这样的人很稀有，而且越来越少，这与体内保留了多少古翼民血脉有关
      圣具: 把圣纹固化在器物上的造物，内部光路流转，可以被圣纹激活。小的可以拿在手里，大的散布在圣都与群山各处，翼民视为至宝；如今的人只知道怎么用，不知道其中的原理
      教堂构装: 翼民眼中的神圣构造，实际上是上古设备留在外部的操作接口，供人取用圣光
      圣礼的真相: 这些圣礼原本是维护与使用上古仪器的操作规程，一代代演变成仪式，成了仪式知识
      保管与册封: 教会是上古遗产唯一的保管机构，用教义代替法律；外来的魔导技术一律登记，擅自引入被视为玷污，由审检局与白羽裁庭处置
      隐患: 圣纹可以被技术理解与改良。这个真相一旦公开，以血脉与遗产为根基的神权秩序就会动摇；传统派死守教条，因为教条里还保存着最后的操作知识
