    群峰地带:
      概览: |
        主峰之外的群山主体，山峰像翅膀一样层层抬升。各座山峰上设有翼民的公共机构：教义部与谱库在曙峰，圣具锻造坊在霜崖，空战训练场在风切崖，卫队驻地守在炽岭，功勋碑园立在月岭；群山深处还有孤山眠云岭，以及开采圣光矿的光砾坪。山峰之间的山路由石阶、吊桥与驿站连接，直通主峰圣都
      地理:
        类型: 高峻山地，主峰之外的群峰主体地带
        主要地形:
          云海断崖: 山峰之间的断崖群，崖下云海翻涌，圣光矿脉嵌在崖壁里，也就是云海断崖矿脉
          峰间山道: 连接群峰的主干山路，石阶、吊桥与驿站沿着山脊相连，直通主峰圣都
          孤山: 偏离群峰主列的独立山体，比如眠云岭，山顶终年云雾缭绕，很少有人去
          垭口与鞍部: 山峰之间的低凹处，风大雾浓，是穿越群峰的捷径，山泉大多从这里渗出
          古代遗构: 群峰岩壁间散布着封死的石门与规整得过分的石阶，疑似古翼民留下的遗迹，翼民都会绕开，从不敲门
        气候:
          类型: 高山山地气候，随海拔垂直分带
          温度: 半山腰凉爽，云海带寒冷潮湿，接近主峰处接近高寒
          风与降水: 断崖处风势猛烈，垭口云雾浓重，冬季积雪会封住道路
          特征: 云海线上下的天气截然不同，线上晴朗、线下多雾，一天之内能经历好几种季节般的变化
      生态:
        植被: |
          半山腰是高寒针叶林与苔藓矮灌木，断崖岩缝里长着石生草
          云海带以下蕨类与山花丛生，聚落周围大量种植耐寒果树
        动物: 岩羊、高山狐与貂，猛禽栖息在断崖上；矿道深处偶尔有蝙蝠群；驮兽沿着山路往来
      资源:
        云海断崖矿脉: 圣光矿的产地，出产圣光矿石，供水岚区工坊熔炼与圣具锻造，是群峰最主要的物产
        林产: 高寒针叶林出产建材与木柴
        山泉: 崖间泉眼众多，汇成水流供聚落与沿途驿站取用
        探索: 群峰遗迹与矿脉深处偶尔能找到传说品质的材料与物品
      主要节点:
        光砾坪: 半山腰向阳的崖边平台，圣光矿采掘聚落，矿道直通云海断崖矿脉，深处一直挖到封脉壁
        眠云岭: 群山深处的孤山，封存着异界遗骸、禁忌圣具与蚀界污染样本，是圣眠所体系在群山中的延伸
        曙峰: 教义部、白羽谱库与白羽裁庭所在，教义与谱系管理的公共中心
        霜崖: 圣仪院圣具锻造工坊所在，负责圣具的冷淬与最终检验
        风切崖: 圣翼骑士团空战训练场所在，演练分翼机动战法的地方
        炽岭: 圣职卫队的驻地，负责守卫地火热泉
        月岭: 翼民公共的功勋纪念地，功勋碑园与传令牧场所在
