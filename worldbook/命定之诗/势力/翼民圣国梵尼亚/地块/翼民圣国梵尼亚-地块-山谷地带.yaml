    山谷地带:
      概览: |
        群峰之间的谷地与河谷，是翼民聚落与农耕最密集的地带。溪流与泉水汇成小河沿着山谷流淌，两岸梯田与果园交错，村落沿水而建，石木房屋顺着山坡层层叠叠；山路沿山谷穿行，串联起村落、崖边平台与巡礼点，栖羽城在半山腰的台地上，净羽台在巡礼圣路的途中
      地理:
        类型: 群峰之间的谷地与河谷，翼民聚落与农耕最密集的地带
        主要地形:
          河谷: 溪流与泉水汇合的谷地，两岸梯田与果园交错，村落沿水分布
          山间盆地: 群山环抱的小型盆地，土层厚、水源充足，聚落大多选在这里
          半山台地: 谷壁上缘的向阳台地，栖羽城等城镇所在
          溪涧: 崖间泉水汇成的小溪，为聚落与梯田供水，在谷口汇入山前水系
          废弃涵洞: 深谷中被砌死的古代涵洞，洞口爬满藤蔓，溪水从洞壁缝隙中渗出
        气候:
          类型: 山地谷地气候，比山峰上温和湿润
          温度: 谷底凉爽，昼夜温差比山峰上小
          风与降水: 清晨和黄昏雾气浓重，降水比山峰上丰沛，冬季谷底会结霜
          特征: 云海在谷口翻涌，雾气顺着山谷灌入，一天之内晴雾变化多次
      生态:
        植被: |
          谷底是阔叶林与灌木丛，梯田与果园交错
          谷壁长着苔藓与蕨类，聚落周围大量种植耐寒果树
        动物: 溪中的鱼虾与水鸟，驮兽沿着谷中道路往来，是谷地最常见的动物
      资源:
        农业: 梯田出产谷物与蔬果，是群山主要的粮食来源
        淡水: 溪流与泉水汇合，供聚落、梯田与沿途驿站取用
        山货: 水果与山货沿谷中道路集中运输，供应栖羽城集市与山麓转运
        探索: 深谷遗迹与废弃涵洞中偶尔能找到传说品质的材料与物品
      主要节点:
        栖羽城: 半山腰向阳台地上的翼民聚居小城，有市集与工坊，山路连通圣都与山麓
        净羽台: 巡礼圣路中段的崖边平台，巡礼者在这里休息、净羽、投羽祈愿，大修道院的修士也从这里下山执行清剿
        山中村落: 沿山谷分布的翼民村落，种田、酿酒、饲养驮兽，是谷地最常见的聚落形态
