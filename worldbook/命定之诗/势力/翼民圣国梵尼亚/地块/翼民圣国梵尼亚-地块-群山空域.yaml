    群山空域:
      概览: |
        群山上空悬浮着大量空岛，岛面覆盖着茂密的植被，各自按外观取名，比如长满野橄榄与紫藤的定情屿。大多数空岛无人照管，野草丛生，鸟兽栖息；少数岛屿常年有人往来，翼民在岛上许愿系羽、举行仪式
      地理:
        类型: 群山上空的高山空域，浮岛散布的空中世界
        主要地形:
          空岛群: 数量众多、形态各异，表面覆盖着茂密植被与青苔，大多是荒废的奇观，按外观取名
          天然空岛: 自然形成，占绝大多数
          圣造浮岛: 古翼民以天然空岛为基座改造而成的兵器与构造体，数量稀少，大多已经休眠或损坏，类型包括防御节点、战舰与空中工厂；唤醒它们的关键在于失传已久的圣纹技术，不是靠共鸣强弱就能解开的
          泣空遗迹: 圣律天穹自毁封印主通道后留下的残骸，是圣造浮岛的极端案例，悬浮在偏远的空域
        养护: 圣造浮岛基本处于休眠，部分已经损坏；只有圣都上空的圣域空岛（穹顶圣域）得到了长期充分的养护，其余普遍缺乏保养
        气候:
          类型: 云海之上的高空气候
          温度: 昼夜温差大，白天日照强烈，入夜寒冷
          风与降水: 大风天气多，水汽从云海蒸腾而上，岛与岛之间偶尔有骤雨与风暴
          特征: 云海平静时晴空万里，风暴来临时云海翻涌，在岛间飞行被视为危险的旅程
      生态:
        植被: |
          岛上野橄榄、紫藤、蕨类与苔藓丛生，岩石上覆盖着青苔，野草自由生长
          光尘花与野果散布在岛上的平地间，花蜜是翼民蜜酒的原料
        动物: 飞兽与鸟群栖息在岛屿之间，蜜蜂和蝴蝶随花期迁徙，驯养的牲畜由翼民运到岛上放养
      资源:
        岛产: 野橄榄、浆果、花蜜与光尘花蜜酒原料，构成翼民清淡的饮食
        探索: 荒废空岛深处偶尔能找到传说品质的材料与物品，翼民大多不知道它们真正的价值
        圣域养护: 只有圣域空岛得到长期的礼制养护，殿群能够自给运转
      主要节点:
        浴羽屿（定情屿）: 长满野橄榄与紫藤的浮岛，岛的边缘垂挂着细细的瀑布，求婚者会在女神像前的石栏上系上白羽
        泣空遗迹: 偏远空域中圣律天穹自毁后的残骸，翼民很少前往
