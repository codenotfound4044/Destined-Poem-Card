    山麓地带:
      概览: |
        神迹群山向平地过渡的地带，山脉与平原在这里相接。山脚聚集地贴着断崖展开，阶梯式市集与崖道交错重叠，是朝圣的前站，也是外族贸易与物流转运的中转地；货队通过圣翼驮运台转运物资，朝圣者从这里踏上登山的长阶梯
      地理:
        类型: 山脉向平原过渡的山麓地带，朝圣、外族贸易与物流转运的枢纽
        主要地形:
          崖脚断崖: 山脉与平原相接的岩壁，断面平整，山脚聚集地沿崖展开
          山麓缓坡: 断崖脚下向平原缓缓下降的坡地，道路从这里分别通往群山与外界
          溪谷: 山泉汇合的谷地，为聚落供水，谷口是外族商队的歇脚处
          古断面: 山麓断崖平整得像被刀切过，不是风雨侵蚀形成的，垂羽礼拜堂就建在它的凹陷处
        气候:
          类型: 山麓温带湿润气候，比山峰上温和
          温度: 昼夜温差比山峰上小，夏季凉爽，冬季温和
          风与降水: 云雾多，山风顺着山谷吹下，降水比山区内部丰沛
          特征: 清晨和黄昏雾气浓重，风铃声随着气流此起彼伏
      生态:
        植被: |
          山麓是阔叶林与灌木丛，谷地梯田与果园交错
          断崖岩壁长满苔藓，聚落周围大量种植挡风的乔木
        动物: 山地兽类与鸟类，驮马驮牛沿着大道往来，是山麓最常见的动物
      资源:
        农业: 谷地梯田出产谷物与蔬果，养活聚落，也补给进山的人
        林产: 山麓林木供应市集建筑与崖道修建
        贸易: 外族商品与山中物产在这里集散，贡品与货币同时流通，是群山主要的对外窗口
        探索: 古断面与崖壁深处偶尔能找到传说品质的材料与物品
      主要节点:
        山脚聚集地: 山麓前站，朝圣前站/外族贸易/物流转运，阶梯式市集、崖道、驿站与货仓交错重叠
        垂羽礼拜堂: 崖壁凹陷处的古老石砌建筑，彩绘玻璃窗向谷地投射出羽翼形的光影
        圣翼驮运台: 空中货物交接平台，货队常驻，负责山麓与群峰之间的转运
        云阶关: 进入山路的关口与收税站，朝圣者从这里入山
