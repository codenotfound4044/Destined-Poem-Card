    主峰圣域:
      概览: |
        神迹群山最高的主峰，圣都所在，也是翼民圣国梵尼亚的宗教核心与直接统治区域，翼民也叫它"天空圣域"。峰顶高寒干燥，空气稀薄，水岚、云钟、霄霞三区沿着山峰盘旋而上，白石台地与回廊层层向上收窄；圣都上空悬浮着穹顶圣域，教皇宫与辉煌女神大圣殿就建在它上面，这座浮岛如今处于休眠状态
      地理:
        类型: 高山峰顶圣域，圣都所在的宗教核心与直接统治区域
        主要地形:
          主峰: 神迹群山的最高峰，独自高耸在云海之上，四周都是断崖，其余山峰像展开的翅膀一样层层向它抬升
          峰顶台地: 圣都所在，白石台地与峭壁相接，水岚、云钟、霄霞三区沿着山体盘旋
          垂天白塔林: 峰顶的礼制塔林，记录着受封家族的名号与功绩，西角空着一座废塔
          穹顶圣域: 悬浮在圣都上空的圣造浮岛，在整个浮岛体系中也是最强、等级最高的一座；如今处于休眠，完整接口规范的解读方法已经失传
        气候:
          类型: 高山寒原气候，全年高寒干燥，空气稀薄
          温度: 昼夜温差极大，白天温暖，夜晚寒冷
          风与降水: 强风频繁，以强烈的晴天日照为主，云海线以上很少有雨雪
          特征: 峰顶几乎没有雨雾，云海在脚下翻涌
      生态:
        植被: |
          峰顶台地几乎没有树木，岩缝里长着苔藓与矮草，背风处生长着耐寒的灌木丛
          圣都回廊与台地之间大量种植石鉢光尘花，按礼制四季养护
        动物: 高山猛禽与云海飞兽在空中掠过，栖息在断崖上；峰顶的常住居民只有翼民，陆行动物很少能到达这里
      资源:
        供给: 峰顶几乎没有出产，物资大多依靠群峰的采掘与山麓的转运补给
        知识: 圣纹源典残卷、圣纹模板与圣具分别收藏在圣仪工坊与白羽谱库，是圣国最贵重的保管物
        工艺: 圣都工坊熔炼圣光矿、锻造圣具，技艺靠师徒传授与礼制传承
      主要节点:
        圣都: 峰顶圣都，按垂直分层的礼制与空域秩序建成的白石之城，水岚、云钟、霄霞三区沿着山峰盘旋，长阶梯与连桥贯通各层
        穹顶圣域: 圣都上空的圣造浮岛，教皇宫与辉煌女神大圣殿所在；如今处于休眠，圣纹源典残卷与圣纹模板仍在，解读方法却已失传
        垂天白塔林: 峰顶的礼制塔林，记录着受封家族的名号与功绩，西角空着因背叛信仰被除名那一家的废塔
