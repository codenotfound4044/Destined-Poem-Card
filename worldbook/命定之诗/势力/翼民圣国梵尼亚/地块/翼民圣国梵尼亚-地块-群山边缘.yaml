    群山边缘:
      概览: |
        神迹群山向平地低伏下来的外缘，也是翼民势力范围模糊的边界。山势逐渐平缓，林线慢慢降低，河谷向平原展开，异族的聚居地散布其间，石蒜城、圣日镇就属于这类；边缘地区的翼民住在坡地小村与哨所里，与异族做邻居，圣翼骑士团的空骑沿着山地边缘巡逻
      地理:
        类型: 高山向平原过渡的外缘地带，翼民势力范围的模糊边界
        主要地形:
          外缘山脊: 山势逐渐平缓的丘陵与低山，林线慢慢降低
          河谷: 流出山区的水系切开山地边缘，连接群山与平原
          山口与驿道: 商旅与巡逻队必经的出山通道，聚居地大多沿着这些道路分布
          古石台: 山脊上孤立的石台与风蚀石柱，已经被风化得圆钝，却整齐地指向同一个方向
        气候:
          类型: 山地边缘的过渡性气候，比山区内部温和
          温度: 四季分明，谷地冬季会结霜
          风与降水: 山风与平原气流交汇，降水沿山地边缘分布，时晴时雨
          特征: 清晨和黄昏林线一带雾气缭绕，入夜后平原上的灯火连成一片
      生态:
        植被: |
          针阔混交林逐渐过渡为平原林带，林边草甸与灌木丛相接
          河谷梯田与牧场沿水分布
        动物: 山地兽类与平原鸟类在这里交汇，牧场畜群与驮队往来
      资源:
        农业: 河谷耕地与坡地牧场，出产谷物、牲畜与奶制品
        贸易: 山外货物在这里进出集散，盐、铁与山货在此交换
        矿产: 外缘丘陵偶尔出产铁矿与石料
        探索: 古石台与山脊遗迹深处偶尔能找到传说品质的材料与物品
      主要节点:
        石蒜城: 群山边缘的聚居地，异族与帝国在这里定居往来
        圣日镇: 群山边缘的聚居地，外缘零散村镇中普通的一个
        外缘哨所: 圣翼骑士团边境巡逻的营地，沿山地边缘分布，空骑在林线上空巡逻
        山口驿站: 出山商路上歇脚和以物易物的地方，两地方言在这里混杂在一起
