  贵族家族（梵尼亚）:
    说明: 十二家先祖的功绩横跨两次位面战争——两次战争都关系到位面的存亡：第一次战争中，翼民与精灵共同铸造圣律天穹，扭转了败局；第二次战争中，天穹以自毁封印了主通道，翼民的存亡一度悬于一线。战后，教廷通过圣羽加冕礼册封了十三个家族，受封者行垂羽效忠礼，名号与地位记录在白羽谱库中。各家族靠家臣、家业与世袭职务延续下来，族中年轻人大多进入圣职、军队或工坊。圣座是教廷的职位，不属于任何家族；十三家中有一家后来因背叛信仰被除名，名字也被抹去，垂天白塔林西角只剩下一座废塔，现存十二家。各家的"活动地"是他们世代任职的地方——这些机构与山峰都属于教廷，家族只是按惯例担任职务，并不拥有那些地方
    圣座家族:
      辉翎家族:
        先祖: 第一次位面战争东线崩溃时，在峰顶收拢败军、难民与圣职者，建立起战时共同体，打下了圣都的基础
        常见任职: 教义部、白羽谱库与白羽裁庭
        家训: 长夜之后，我即黎明
        徽记: 金羽绕日
        活动地: 曙峰，设有教义部庄园与抄典坊
        家臣: 守卷家，世代侍奉辉翎家，负责主家的仪礼与谱库日常事务，对谱系条目的熟悉程度甚至超过主家
        立场: 传统派
      银霜家族:
        先祖: 第一次位面战争末期，与精灵匠师共同铸成圣律天穹的核心圣纹，并主持最终检验，让天穹得以启用，扭转了战局
        常见任职: 圣仪院高阶圣仪官、圣具匠
        家训: 唯有经受考验者长存
        徽记: 覆着冰霜的银色羽毛
        活动地: 霜崖，设有圣具锻造坊
        家臣: 灰帚家族，世代为银霜家族服务，负责净化仪式、器物清洁与工坊的日常维护
        立场: 维新派
    骑士家族:
      裂空家族:
        先祖: 第二次位面战争初期，创立分翼机动战法，重整翼民军队；在断空战役中用分翼奇袭围歼了异界先锋空骑，夺回主战区的制空权，为联军赢得了战争初期的喘息之机
        常见任职: 圣翼骑士团将领、教官
        家训: 我即雷霆
        徽记: 雷羽裂云
        活动地: 风切崖，设有空战训练场与风舍
        家臣: 栖风家，世代侍奉裂空家，负责风舍与战前整备羽翼，族人世代担任裂空家翼骑士的侍从
        立场: 传统派
      炽翎家族:
        先祖: 第二次位面战争的封印行动中，率领残部封锁核心圣域入口，一直坚守到天穹封印闭合，以全员牺牲的代价换来了封印的完成与主力的撤离
        常见任职: 圣职卫队军官
        家训: 烈火不退
        徽记: 赤羽擎火
        活动地: 炽岭，圣职卫队的驻地
        立场: 传统派
      长歌家族:
        先祖: 第二次位面战争中各军失去联络时，重建了横跨大陆的高空侦察传令网，并成功锁定异位面主通道的特征，为后续行动打下基础
        常见任职: 圣翼功勋院、骑士团传令体系
        家训: 风暴遗忘的，由我们铭记
        徽记: 白羽踏月
        活动地: 月岭，设有牧场与功勋碑园
        家臣: 拾光家，世代侍奉长歌家，负责记录战歌与誊写功勋，家族历史与主家的战绩记在同一卷里
        立场: 同情改革派
    匠师与文职家族:
      锻羽家族:
        先祖: 第一次位面战争中，主导圣律天穹承力构件与圣纹军备的铸造，为翼民精锐圣翼骑士团配备了圣光武装
        职能: 按圣仪院的模板承接礼器与圣具毛坯的制造
        常见任职: 水岚区熔炉群匠师、被征调到圣仪工坊的匠师
        家训: 我们的翅膀铸于铁砧之上
        徽记: 砧上生羽
        居所: 水岚区熔炉群
        立场: 改革派
      沐翎家族:
        先祖: 第一次位面战争中开创了圣光涤愈术，后来在圣都创立了治愈院
        常见任职: 治愈院、圣女圣殿
        家训: 每一道伤都是我的伤
        徽记: 白羽抚水
        居所: 云钟区
        立场: 维新派
      启翎家族:
        先祖: <绝密>两次位面战争之间创立了初光礼，把圣纹嵌入体内，让翼民可以凭意念调用圣纹</绝密>
        常见任职: 授种派仪礼官
        家训: 愿每一根羽毛都不忘最初的晨光
        徽记: 晨羽引光
        居所: 霄霞区
        立场: 中立
      纪翎家族:
        先祖: 第一次位面战争初期，奉命在翼民与精灵之间往返斡旋，促成两族缔结盟约，圣律天穹才得以共同铸成
        常见任职: 白穹书馆、圣务局文书体系
        家训: 天穹写在我们的誓言里
        徽记: 羽笔卷云
        居所: 云钟区
        立场: 传统派
      静翎家族:
        先祖: 第一次位面战争结束后，奉密令封存战争遗留的异界遗骸与禁忌圣具，创立了圣眠所与安息礼法
        常见任职: 圣眠所、安息派
        家训: 被埋葬的，我将永远背负
        徽记: 垂羽入夜
        居所: 霄霞区冥想室
        立场: 中立
      笃羽家族:
        先祖: 第二次位面战争结束后，汇编散失的战技、仪礼与圣职学识，创立学院传授给后人
        常见任职: 圣学院教师、训导者
        家训: 学识不看血统
        徽记: 双羽持卷
        居所: 云钟区
        立场: 传统派
      衡翎家族:
        先祖: 第一次位面战争后，主持圣都的圣职清查，创立圣选署与候补递补制度，让战争中折损的军职、教务与仪礼得以延续
        常见任职: 圣选署
        家训: 每一根羽毛都有它的分量
        徽记: 天平与羽
        居所: 浮岛缘台
        立场: 中立
