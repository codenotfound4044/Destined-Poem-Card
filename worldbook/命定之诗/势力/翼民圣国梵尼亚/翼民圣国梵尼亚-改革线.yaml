  改革线:
    引子: 复兴纪元487年，一名圣翼骑士在执行公务时负伤，濒临死亡。修复圣纹时，一名年轻的圣仪官尝试引入了外来的魔法技巧，骑士痊愈之后，圣纹的质量竟有所增强。民众把这当作神恩，欢庆不已；只有极少数人想到了另一种解释
    另一种解释: 翼民向来把圣纹看作神赐，不容改动；圣纹力量更强的人，也被认为蒙受了更多神恩。但或许，改动圣纹本身就能提高圣纹的适应度
    高贵血脉的真相: 圣纹是千年前的古翼民针对当时翼民的体质设计出来的产物。现代翼民虽然仍能使用，却并不完全适应。如今适配高的翼民，圣纹进化得更快，只是因为他们保留了更多古翼民的血脉
    当前知情范围: 只有少数最高层与圣仪院的部分人员知情，此外还有极少数他者。翼民整体仍把圣纹视作神的恩赐
    知情人的态度:
      传统派: 核心目标是维持现有的社会秩序与道德共识。他们担心，公开圣纹的真相会引发信任崩塌、社会混乱，并动摇对女神的信仰
      维新派: 承认公布真相的风险，但认为可以在既有制度之内吸收并改良技术，再缓慢释出；他们尝试重新解释圣典，渐进地改变社会结构
      改革派: 认为遮蔽与拖延只会积累更大的风险，主张公开事实，集全民之力改良圣纹，让所有翼民都能充分发挥自己的潜力
    圣域兵器: 若有人在圣纹解析上取得进展，又得知浮岛的本质，并进一步获得研究浮岛的机会，便可能真正理解这座古代兵器，让它的完整力量重现于世
