  政治与社会:
    权力结构:
      结构: 绝对的政教合一。教皇的敕令与圣女的神谕是最高意志，世俗法律与宗教教义高度统一
      最高权威: 教皇、圣女与圣座会议（由十二位枢机主教与圣翼骑士团团长组成）
      核心教务: 教义部负责教理，白羽裁庭负责裁决
      圣仪体系: 圣仪院负责礼仪、管理礼器，并负责圣纹的传承与圣具的维护
      行政与教育: 圣务局与圣选署负责行政，圣学院负责教育，治愈院负责医疗与慈善
      军备:
        圣翼骑士团: 大陆最强的空中军事力量，护卫圣都，巡防边境
        圣职卫队: 负责驻防、城内秩序与圣域安保
      组织原则: 教廷各部院、军队、圣具与谱库都直属教廷与圣座会议。一旦受职，效忠的对象就是女神与全体翼民，教廷的命令高于家族的命令
    阶级体系:
      结构: 教廷凌驾于所有家族之上，贵族家族的地位与家业都受教权约束
      圣阶: 教皇 > 侍神圣女 > 圣翼骑士团长 > 枢机主教 > 大主教、候补圣女 > 主教 > 翼骑士 > 祭司、牧师 > 圣仪大师 > 信众 > 外族侍从
      重要序列:
        圣座序列: 教皇、侍神圣女、候补圣女、枢机主教、圣翼骑士团长
        教务序列: 大主教、主教、牧师、祈言师
        圣仪序列: 祭司、圣仪大师、圣仪官、圣具匠
        武备序列: 圣翼骑士团长、翼骑士、圣职卫队官
    贵族家族:
      大家族: 第二次位面战争后，教廷通过圣羽加冕礼册封了十三个大家族；其中一家已被除名，现存十二大家族
      传承: 各家族依靠家业和代代相传的职务维持影响力，族中年轻人大多进入圣职、军队或工坊；一些家族长期经营某些机构，高级职位按惯例由该家族出任。但最高任命权与罢免权始终握在教廷手中
      荣耀: 家族名声比性命更重要；受辱者可以通过比翼斗洗刷耻辱，家族间的仇怨会延续好几代，但不能越过教廷默许的界限
      骑士之道: 荣耀、忠诚与守护是贵族家族的根本；他们靠战功、学识与品行赢得声望，事迹会刻在家族纪念碑上
    教律:
      诵典: 翼民从小背诵圣典章节，早晚各诵一遍，诵读声会与体表圣纹产生共鸣
      仪轨: 所有仪式都按传承下来的规定进行
      戒条: 诚实、守诺、洁羽是做人的根本；外来的魔导物品必须登记，违者由白羽裁庭裁决
      圣事: 初光礼、展翼礼、净羽礼、加冕礼等，都由圣仪院主持
    对外关系:
      友善: 精灵
      死敌: 位面之敌及其残余
