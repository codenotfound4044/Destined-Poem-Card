    圣都-穹顶圣域:
      描述: 浮岛悬浮在圣都上空，殿群与穹顶彼此相扣，白玉与金纹构成一条垂直中轴。<秘密>整座浮岛本身就是古翼民遗留的战略级空域兵装，圣殿与回廊被封闭的深处通向内部结构</秘密>
      功能: 圣仪主持/神谕发布/圣座议决/圣具维护/古代兵装封存/圣职遴选
      概括:
        环境: 空气寒冷干燥，光束沿着中轴落下，风从岛的边缘掠过，声音低沉
        建筑: 白玉穹顶与环形回廊层层叠合，殿群顺着台地向上攀升；承重结构厚重，台地之下压着封闭的兵装结构
        人文: 高阶教职人员与贵族出入，言行举止都受礼规约束
      <秘密>
      兵装现状:
        状态: 休眠中，因长期仪礼养护已经完全恢复
        启动条件: 需要完整的接口规范；圣纹源典残卷与圣纹模板仍在，但十二家族无人能读懂
      </秘密>
      地标: 辉煌女神大圣殿，教皇宫，圣女圣殿，教义部，白羽裁庭，圣仪院主殿，圣仪工坊，圣座会议厅，圣选署，浮岛缘台，金白圣阶
      地标详情:
        辉煌女神大圣殿: 穹顶宏伟，内壁刻满圣纹；清晨，圣纹的光束贯穿中轴，经过光导圣柱落在圣纹祭坛上
        圣仪工坊: 外观朴素，门禁极严，存放圣纹模板与圣具；圣具匠在这里举行养护仪式——诵出圣典中记载该圣具的章节，用圣纹引导圣光滋养圣具，把维护当作礼拜
        圣选署: 负责候补名册、圣纹选拔、抽签排序与圣职空缺的递补；署令直接呈交圣座会议
        浮岛缘台: 悬在穹顶浮岛边缘的狭长观景台，圣选署在这里举行候补唱名与递补仪式，衡翎家的居所就在旁边
        金白圣阶: 贯通各殿群的主礼仪阶梯，石阶内埋有细密金纹，在特定时刻会有流光闪烁
