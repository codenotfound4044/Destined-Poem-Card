  圣都:
    标识:
      位置: 神迹群山主峰峰顶，云海之上
      规模: 超级城市（宗教圣地）
      人口构成: 翼民92% | 外族（兽族人族）侍从6% | 朝圣者2%
    环境: 云海之上的峰顶圣都，白石台地与峭壁相接，回廊与阶梯串联起垂直的秩序
    气候: 高寒干燥，昼夜温差大，强风频繁
    概况: 天空圣域的中心圣都，一座按垂直分层的礼制与空域秩序建成的白石之城。山脊上的阶台与断崖边的回廊层层向上收窄，水岚区、云钟区、霄霞区沿着山体盘旋而上，霄霞区上空是穹顶圣域。城外另有山脚聚集地作为前站，长阶梯与连桥贯通各层，起降平台与空中廊道构成立体交通
    城市规则:
      飞行礼: 核心圣域禁止自由飞行，特许仪式例外
    物价:
      收入提高20%
      物价提高50%
    主要资源:
      购买:
        稀有品质材料（水岚区）
        史诗品质物品（霄霞区与穹顶圣域）
      探索:
        传说品质材料/物品（神迹群山遗迹、云海断崖矿脉）
      制造:
        史诗品质装备/物品（水岚区）
      贸易:
        稀有品质装备/材料（水岚区）
      教育:
        史诗品质材料鉴别/装备工艺（圣学院/圣仪院）
    主要城区:
      水岚区: 外来接待区域与工坊街巷相邻，常住翼民与外族侍从混居，基础供给与日常劳作最密集，清晨和黄昏时山雾会漫上低处的台地
      云钟区: 以圣学院与治愈院为主的教务区，居住街巷与静默回廊交织，学徒与修士往来频繁
      霄霞区: 白羽谱库与高塔群所在的权力与礼制区，受封家族与高阶教务人员住在这里
      穹顶圣域: 教皇宫与辉煌女神大圣殿所在的宗教中枢，是被圣殿群与礼制长期保护的古代浮岛；<机密>本质曾投入位面战争的战略级兵器</机密>
    任务层级: S级（最高）
    最高生命层级: 6（穹顶圣域教皇宫）/5（圣翼骑士团）
