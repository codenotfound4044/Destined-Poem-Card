    圣都-水岚区:
      描述: 圣都最外围的台地与工坊区，住所层层嵌入岩壁，台地上的街巷在风道间盘旋；清晨和黄昏时山雾会漫上低处的台地，木制步道能抵挡强风，熔炉的热浪与香盐气味沿着回廊扩散
      功能: 工坊生产/贡赋交接/外来接待/物流转运/起降集散
      概括:
        环境: 山体台地与起降台相连，步道与梯桥交错成垂直路网，清晨和黄昏的雾气从崖下涌上来，傍晚时灯火沿着步道排成长列
        建筑: 白石地基嵌在岩壁里，木制栏棚与悬桥沿着崖壁铺开，嵌在岩壁中的住所向外伸出带顶的廊道，屋顶与连廊都能当路走
        人文: 工坊翼民与侍从混居，秩序由圣务局外署与圣职卫队维持
      地标: 圣务局外署，圣务局总署，白石工坊街，祈光食坊，低翼居，风翼台阶，起降台群
      地标详情:
        圣务局外署: 贡赋与物资的交接点，石壁上常贴满工坊排班与配给的告示
        圣务局总署: 水岚区的行政中心，统筹配给与外来者事务
        白石工坊街: 熔炉群所在地，匠师按圣仪院规定的模板锻造礼器与圣具毛坯；成品送到圣仪院检验圣纹、登记、入库，合格的才算圣具，由圣仪院统一管理，光尘与香盐气味常年不散
        风翼台阶: 通往云钟区的盘旋台阶，也是起降台的起点，货队在这里集结
