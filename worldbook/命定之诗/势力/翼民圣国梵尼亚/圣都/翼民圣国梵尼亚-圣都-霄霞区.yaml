    圣都-霄霞区:
      描述: 高塔与翼廊围成一座白石天空之城，受封家族与高阶教务人员住在这里，礼仪与声望决定社交秩序；金纹路标沿着廊道指引方向，仪仗队在长桥间缓缓行进，清晨和黄昏时霞光从云海漫上塔尖
      功能: 家族议事/礼制裁决/谱册登记/观礼接待/安眠与封存
      概括:
        环境: 高空风道与廊桥密集，台阶层层向上收窄，清晨和黄昏的霞光染过塔林，风声低沉
        建筑: 暖白色的高塔之间架着连桥，金色路标与金属饰线点缀着廊桥，向内围合的庭院很多，岩壁深处藏着冥想室
        人文: 受封家族与教务人员在此居住，圣职卫队在廊桥与塔门之间巡逻
      地标: 白羽谱库，圣翼议会厅，审检局本部，圣职卫队营所，天穹观礼台，白羽裁庭，圣翼骑士团空港，霜白长桥，金纹仪仗台，垂天白塔林，圣眠所
      地标详情:
        白羽谱库: 存放血统与圣纹谱系，也就是圣纹形态的图鉴；查阅必须经过教义部许可，大门上方刻着家族誓词
        圣翼议会厅: 大主教与骑士团团长的议事场所，议事钟声清晰可闻，钟声就是召集令
        圣职卫队营所: 圣域守备驻地，日夜轮班
        白羽裁庭: 裁决贵族纠纷与违反礼制的案件，也受理荣誉决斗的申请，判决通过钟声公布
        霜白长桥: 连接垂天白塔林的主桥，阅礼日的仪仗队从这里缓缓走过
        垂天白塔林: 霄霞区最高的集束塔群，受封十二家族的宅邸所在，每座塔都悬挂着家族徽记，侧塔住着世代侍奉的家臣；原本有十三座塔基，现存十二座
        废塔: 垂天白塔林西角第十三个家族的旧塔，门窗都被封死，饱经风雨侵蚀却无人修缮
        圣眠所: 教廷下属、由安息派主持的安眠与封存机构，设在塔林后方的岩壁冥想室中，收存亡者的安息灯，并封存两次位面战争遗留的异界遗骸与禁忌圣具
