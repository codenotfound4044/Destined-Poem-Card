    圣都-云钟区:
      描述: 学院与治愈院嵌在崖壁台阶之间，回廊与光井交错，组成一座学院城，钟声穿过云层传下山去，穿白袍的学徒来来往往
      功能: 教育/医疗/抄写圣典/礼制训练
      概括:
        环境: 钟楼规定着作息礼仪，楼内由圣光驱动的传动构装按圣座时刻敲钟，钟声穿过云层传遍全城；白石回廊回声清晰，入夜后灯带沿着街道延伸
        建筑: 学院建筑群嵌在崖壁之间，风庭与净化井相连——净化井的井壁嵌着圣纹，能汲取并净化圣光，供净羽礼与疗愈使用；廊桥贯通各院
        人文: 教务与治愈人员居多，学徒往来不断，重视自律与礼仪
      地标: 大修道院，圣学院，治愈院，圣仪院学部，净羽广场，白穹书馆，风廊市集，轻钟回廊
      地标详情:
        大修道院: 中环区的核心教育综合机构，统管圣学院、治愈院与圣仪院学部的教学，内有进阶三院（圣翼护卫院、辉光治愈院、暗面裁决院）、宿舍区与地下阿比斯；校风谦逊守序，学生常说"学问是敬神的路"。院中的教学构装与圣具养护坊都按圣纹接口规范运转——学徒凭圣典与亮纹驱动构装，诵出圣典中记载该圣具的章节，完成养护仪礼，把技术当作礼拜
        圣学院: 教授礼仪、史诗与圣纹基础。学徒在这里受训，长廊墙上刻满了训诫铭文。他们从背诵圣典章节开始，按顺序练习基础图形——线、环、羽、矛、泉，再学习亮纹与投影构造
        治愈院: 负责圣光疗愈与翅膀伤势的修复，外来病患必须登记，风庭的光井汲取圣光用于制药，院内常有净化香雾。所谓疗愈，其实是圣纹修复技术的民用版本
        圣仪院学部: 礼仪与圣具基础课程的所在地。学徒在这里完成仪式训练，圣纹形态辨识、圣典背诵与亮纹仪式都从这里学起
        净羽广场: 日常净羽礼的公共场地。清晨，翼民在这里一根根整理羽毛，诵读圣典中赞美羽翼的章节，节拍与钟声一致；这里也是通过净羽礼评定身份高低的地方
