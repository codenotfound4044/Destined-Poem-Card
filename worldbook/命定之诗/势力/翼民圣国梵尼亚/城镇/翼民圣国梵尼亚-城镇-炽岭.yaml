  炽岭:
    描述: 群山腹地的赤色山岭，地下火脉活跃，热泉沿着山谷涌流，蒸汽常年不散。圣职卫队的营地沿山岭分布，操练和轮班日夜不停，是圣国的守备驻地，卫队军官大多出自这里；热泉群供卫队温热盔甲、休息羽翼。深谷尽头有一扇旧闸门，叫擎火闸，表面铸满火焰纹路，常年紧闭，由卫队世代看守
    功能: 圣职卫队的驻地，负责守卫地火热泉，卫队军官的培养地
    位置: 群山腹地，地下火脉活跃的赤色山岭，热泉蒸汽常年不散
    概括:
      环境: 赤色山岭透出地火的光，热泉沿着山谷涌流，蒸汽弥漫，入夜后谷底红光向上蔓延
      建筑: 圣职卫队的营地沿山岭分布，军旗上绣着赤羽擎火徽记，热泉群散布在山谷间，深谷的擎火闸常年紧闭，殉火碑立在山岭边
      人文: 卫队操练和轮班日夜不停，在热泉旁温热盔甲、休息羽翼，守卫群山的山口要道；殉火碑上刻着当年为封锁圣域入口而牺牲的卫队前辈，供翼民们悼念
    地标: 卫队屯所，热泉阵，擎火闸，殉火碑
    地标详情:
      卫队屯所: 圣职卫队轮流驻守的营寨，操练和轮班日夜不停，军旗上绣着赤羽擎火徽记
      热泉阵: 山岭间的地火热泉，蒸汽弥漫，卫队在这里温热盔甲、休息羽翼
      擎火闸: 深谷尽头的巨大旧闸门，表面铸满火焰纹路，卫队世代看守、从不开启，传说门后封着地火之核
      殉火碑: 刻着当年为封锁圣域入口而牺牲的卫队前辈名字的石碑，翼民与卫队常来悼念
