  风切崖:
    描述: 群山西缘风口处的险峻山崖，狂风常年灌入崖间，隔着山谷与月岭相望。圣翼骑士团的空战训练场设在崖边，分翼机动战法在这里代代演练，是骑士团将领与教官的培养地，也是翼骑士受训的起点。风舍靠着崖壁建造，负责整备羽翼与盔甲，战前为出征的翼骑士整理羽毛、穿戴盔甲。崖顶立着一根铁灰色的旧桩，叫落雷桩，风吹雨打也不生锈，桩顶的凹槽十分规整
    功能: 圣翼骑士团空战训练场，分翼机动战法的演练场地，骑士团将领与教官的培养地
    位置: 群山西缘风口处的险峻山崖，狂风常年灌入崖间，隔着山谷与月岭相望
    概括:
      环境: 险崖常年被狂风切割，风道纵横，云层低垂，旗台上的旗帜在风中猎猎作响
      建筑: 空战训练场设在崖边，风舍沿着崖壁错落分布，崖顶的落雷桩孤零零地矗立着
      人文: 翼骑士在这里世代受训，分翼机动战法的演练从未中断，风舍负责整备羽翼与盔甲、战前为骑士整理羽毛并穿戴盔甲
    地标: 空战训练场，风舍，落雷桩，雷羽旗台
    地标详情:
      空战训练场: 崖间风道中的训练场地，分翼机动战法在这里代代演练
      风舍: 靠着崖壁的住所，负责战前整备羽翼与盔甲
      落雷桩: 崖顶的铁灰色旧桩，风吹雨打也不生锈，桩顶的凹槽十分规整，传说是古时驯服雷电留下的
      雷羽旗台: 山口处的旗台，悬挂着雷羽裂云徽记，狂风常把旗帜吹得猎猎作响
