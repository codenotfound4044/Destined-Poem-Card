  净羽台:
    描述: 巡礼圣路中段的崖边平台，一道细泉从崖缝中涌出，汇成一汪不结冰的浅泉。巡礼者在这里休息、净羽，把脱落的旧羽投入泉中祈愿；崖壁上凿有冥想室，巡礼者有的停留一天，有的在此静修几周。大修道院的修士从这里分路下山，清剿野兽、处理偏远村落的异界干扰，回来时也在泉边净羽。平台边缘立着圣路里程碑。这泉没有源头，泉水从石缝里一层层漫上来，常年不干
    功能: 巡礼圣路中段的休息与静修地，巡礼者净羽祈愿的场所，大修道院下山清剿与巡访的分路点
    位置: 巡礼圣路半程处的崖边平台，崖间泉水不结冰，山路从这里分岔下山
    概括:
      环境: 半山腰的崖边平台迎着山风，细泉从崖缝涌出汇成浅泉，常年不冻也不干，平台旁山风穿过岩缝
      建筑: 崖壁上凿有巡礼冥想室，平台边缘立着圣路里程碑，泉边围着低矮的石栏，平台上的歇羽场十分平整
      人文: 这里是巡礼者与大修道院巡访队共用的休息净羽点，投羽祈愿的习俗代代相传
    地标: 洗羽泉，巡礼冥想室，圣路碑，歇羽场
    地标详情:
      洗羽泉: 崖边平台上的浅泉，常年不冻也不干，巡礼者在这里净羽、投羽祈愿，泉底石板刻着同心圆纹
      巡礼冥想室: 在崖壁上凿出的石室，供巡礼者静修和停留
      圣路碑: 记录路程的石碑，大修道院修士下山清剿与巡访都从这里分路
      歇羽场: 平台顶部平整的石地，巡礼者在这里休息、晒羽
