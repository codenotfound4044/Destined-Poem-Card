  月岭:
    描述: 神迹群山高处的一道山岭，月夜格外清朗，隔着山谷与风切崖相望。功勋碑园沿着山坡排列，石碑上刻着历次战役的战功与受勋者的名字，由功勋院的记录官一代代誊写下来；这里是翼民纪念阵亡英雄、清点战功的公共纪念地；山岭间的牧场饲养着长途传令用的空兽，传令兵在踏月坡骑乘空兽起降。圣翼功勋院与骑士团的传令系统都设在这座山岭上。碑园尽头有一口回音井，传令兵出征前会俯身井口，倾听"家的回声"，井底的纹路细密如网，在月光下泛着微光
    功能: 翼民公共的功勋纪念地，功勋碑园与传令牧场，圣翼功勋院与骑士团传令系统所在
    位置: 神迹群山高处的一道山岭，月夜格外清朗，隔着山谷与风切崖相望
    概括:
      环境: 高山草场向着月坡延展，月光清澈，山岭间的长夜十分明亮，风从山口穿过
      建筑: 功勋碑园沿着山坡排列，碑园入口立着带有白羽踏月徽记的石门，牧场环绕着山岭，回音井在碑园尽头，踏月坡紧挨着山岭，供空兽起降
      人文: 功勋院的记录官世代誊写战功、记录战歌，翼民常来这里悼念英烈
    地标: 功勋碑园，月岭牧场，回音井，踏月坡
    地标详情:
      功勋碑园: 沿着山坡排列的石碑，刻着历次战役的战功与受勋者的名字，由功勋院的记录官世代誊写，入口立着带有白羽踏月徽记的石门
      月岭牧场: 山岭间的牧场，饲养着长途传令用的空兽等，和平年代也养了一些其他动物
      回音井: 碑园尽头的古井，传令兵出征前会在这里倾听"家的回声"，井底的纹路细密如网，在月光下泛着微光
      踏月坡: 紧挨着山岭的坡地，传令兵在这里骑乘空兽起降，月夜尤其常用
