  栖羽城:
    描述: 半山腰的向阳台地，石木房屋顺着山势层层叠叠，山路从城中纵贯而过，向西通往圣都，向东下到山脚聚集地。这里是翼民聚居的小城，也是日常商业与工坊的所在地：集市沿着山路铺开，光尘花蜜酒、羽饰器物、石料与山货在这里交易；城中央的圣光礼拜堂负责日常礼拜，也主持婚礼、葬礼等人生仪式。翼民日出后各自出门，采掘者进入崖间矿场，工匠走进工坊，行商踏上山路，日落后回城收起翅膀休息
    功能: 半山腰的翼民聚居小城，日常商业与工坊所在，礼拜与人生仪式举办地，山路连通圣都与山脚
    位置: 半山腰的向阳台地，山路纵贯，向西通往圣都，向东下到山脚聚集地
    概括:
      环境: 半山腰开阔的向阳台地，云海在城下翻涌，山路绕城而过，入夜后灯火一层层亮起
      建筑: 石木房屋顺着山势层层叠叠，集市沿着山路铺开，圣光礼拜堂位于城中央，城边排列着一排排翼棚
      人文: 礼仪规矩严格，婚礼和葬礼都遵循圣光秩序；市集与工坊的日常喧闹与礼拜钟声共存
    地标: 栖羽市集，圣光礼拜堂，云梯山道，旧平台
    地标详情:
      栖羽市集: 沿着山路的半山集市，蜜酒、羽饰器物、石料与山货在这里交易
      圣光礼拜堂: 城中央的礼拜堂，日常礼拜与婚礼等人生仪式在这里举行
      云梯山道: 盘山的长阶梯，向西通往圣都、向东下到山脚聚集地，商队与巡礼者往来不断
      旧平台: 礼拜堂地下的巨大旧平台，表面长满苔藓，一角却光滑得像铸造出来的一样
