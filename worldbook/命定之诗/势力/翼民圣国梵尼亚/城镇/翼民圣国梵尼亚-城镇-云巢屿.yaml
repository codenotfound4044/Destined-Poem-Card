  云巢屿:
    描述: 云海中的浮岛，岛形接近圆形，像一个鸟巢，直径约四公里，岛面像穹顶一样隆起，云海在岛的边缘翻涌成墙；野藤与老树枝从岛缘一直垂到岛底，藤蔓交织缠绕，翼民叫它"云巢"。它是天然浮岛，也是翼民日常聚会、晒羽与举办风铃节庆的地方：岛上没有房屋，到处是藤架与风铃，低矮的石台可以坐卧，岛缘的老树枝盘结成回廊；风铃节时全岛挂满风铃，风一吹便叮当作响
    功能: 翼民日常聚会/晒羽/风铃节庆之地，云海中的休息场所
    概括:
      环境: 一座翠绿的浮岛，野藤垂挂在岛缘与岛底，风吹过时整座岛轻轻摇晃，云海在四周翻涌，藤蔓的阴影里聚着成群的鸟雀
      建筑: 岛上没有房屋，到处是藤架与风铃，低矮的石台可以坐卧，岛缘的老树枝盘结成天然回廊
      人文: 年轻人喜欢待在藤蔓深处，翼民把云巢当作云海中的歇脚处
    地标: 藤影回廊，晒羽场，风铃架
    地标详情:
      藤影回廊: 岛缘老树枝盘结成的天然回廊，藤蔓像帘子一样垂下，翼民喜欢在廊下闲坐，风一吹整条回廊都轻轻作响
      晒羽场: 岛上开阔的空地，风铃节时在这里挂铃，平时用来晒羽和整理羽毛，低矮的石台坐卧都很合适
      风铃架: 风铃节时全岛挂满风铃，风吹过时叮当声响成一片，是云巢最热闹的时节
