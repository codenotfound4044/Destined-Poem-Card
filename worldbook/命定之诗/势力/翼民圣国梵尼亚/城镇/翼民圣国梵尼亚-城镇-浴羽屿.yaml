  浴羽屿:
    描述: 云海中的浮岛，岛形狭长，像一颗橄榄，两端收尖，东西长约二十公里，最宽处约六公里。岛上长满野橄榄与紫藤，岛的边缘垂挂着一道细细的瀑布，常年有人往来，翼民叫它"定情屿"。岛的西端立着一对相拥的翼民石像；翼民认为在这对石像前许愿最灵验，会在这里举行求婚、订婚等人生仪式。求婚者会取下翅膀上最白的一根羽毛，系在石像前的石栏上，整圈石栏都系满了白羽。石像脚下有一条笔直贯穿全岛的脊线，石像就立在脊线的尖端，面朝云海深处。<秘密>圣造浮岛——古代翼民空舰，位面战争时期的空中战舰，处于休眠且已损坏，表面覆满植被。它以天然空岛为基座改造而成，那条笔直的脊线就是舰首主梁；石像是古时立在舰首的翼民纪念雕像，现在的人误以为是女神像。内部存有休眠的驱动结构与圣纹接口，深入探查也许能发现军备残骸与操作遗迹。</秘密>
    功能: 求婚/订婚等人生仪式的举办地，许愿圣地，日常仪式的承载地
    概括:
      环境: 云海中的浮岛，到处长满野橄榄与紫藤，岛缘垂挂着细细的瀑布，常年有翼民往来，清晨和黄昏时云雾漫过树梢
      建筑: 岛的西端围着一圈石栏，石栏后是一对相拥的翼民石像，衣褶与羽翼雕刻得极其细腻，棱角已被风雨磨平
      人文: 老人们说，女神曾在这里应允了第一对恋人的誓言，年轻翼民认为在这对石像前许愿最灵验
    地标: 女神像，石栏
    地标详情:
      女神像: 一对相拥的翼民石像，衣褶与羽翼雕刻得极其细腻，面容安详，经过千百年风雨，棱角已被磨平
      石栏: 石像前的一圈围栏，系满了白羽，风一吹，满栏白羽像雪一样飘动
