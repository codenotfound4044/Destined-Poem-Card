  光砾坪:
    描述: 半山腰向阳的崖边平台，云海在平台下翻涌，崖间矿道纵横交错。采掘翼民世代住在这里，以开采圣光矿为生，矿石经集运台送到圣翼驮运台运下山，供水岚区工坊熔炼。石木房屋沿着崖壁错落分布，晾架、矿棚与集运台交错；平台入口的石龛里立着女神像，翼民开工前会亮出圣纹祈祷，收工后一根根整理羽毛。光砾矿道沿着云海断崖矿脉开凿，出产圣光矿石，最深处一直挖到封脉壁
    功能: 圣光矿采掘/矿石集运/山腹聚落生活
    概括:
      环境: 半山腰向阳的崖边平台，云海在平台下翻涌，崖间矿道纵横交错，石屑与光尘随风飘散，晚霞把矿口染成红色
      建筑: 石木房屋沿着崖壁错落分布，晾架、矿棚与集运台交错，平台入口的石龛又低又小，矿道口挂着用来镇声的风铃
      人文: 采掘翼民世代住在这里，以开采圣光矿为生，他们认为这是侍奉女神的工作
    地标: 光砾矿道，女神龛，集运台，晾羽场
    地标详情:
      光砾矿道: 沿着云海断崖矿脉开凿，出产圣光矿石，供水岚区工坊熔炼；最深处挖到一面乳白色的坚硬岩壁，纹路像羽毛一样细密，怎么凿都凿不动，矿工叫它封脉壁，开工前都要向它行礼；老矿工说，那是女神封住的矿脉，不能凿
      女神龛: 平台入口又低又小的石龛，翼民开工前在这里亮出圣纹祈祷，龛前常年供着白石
      集运台: 崖边集中运送矿石的地方，货队经圣翼驮运台把矿石运下山
      晾羽场: 平台中央的空地，黄昏时翼民在这里一根根整理羽毛、收起圣纹，诵读圣典中赞美羽翼的章节，节拍与崖间风声相合
