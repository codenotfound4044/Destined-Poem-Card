  眠云岭:
    描述: 群山深处的孤山，远离朝圣大道，山间云雾终年缭绕不散。看守翼民按照安息礼法轮班守护山中封存的旧物；山中封存着异界遗骸、禁忌圣具与蚀界污染样本，是执行安息礼法与净化仪式的地方，也是圣眠所体系在群山中的延伸。石砌的封库嵌在山腹中，库门上悬挂着垂羽徽记；山腰的安息台设在崖边，崖壁上凿有冥想室与抄写室，崖间净化井的井壁嵌着圣纹，用于清洗器皿和举行净化仪式
    功能: 封存与看守异界遗骸/禁忌圣具/蚀界污染样本，安息礼法与净化仪式的执行地，圣眠所体系在群山中的延伸
    概括:
      环境: 孤山冷清偏僻，云雾不散，草木低矮，崖壁常年滴水，山风从垭口灌入，白天黑夜都很安静
      建筑: 石砌的封库嵌在山腹中，回廊与冥想室沿着崖壁错落分布，库门上悬挂着垂羽徽记；山腰的安息台设在崖边，平台旁有一座低矮的石塔
      人文: 看守翼民轮班住在这里，世代学习安息礼法，轮流封存旧物、举行安息礼、抄录典籍，与圣都的圣眠所一脉相承
    地标: 封库，安息台，崖壁冥想室，净化井
    地标详情:
      封库: 山腹中的石库，大门上方刻着垂羽纹，库中封存着异界遗骸、禁忌圣具与蚀界污染样本；许多旧物来历不明，看守只记下它们的名称与年份，世代按安息礼法封存
      安息台: 山腰临崖的石台，执行安息礼法的地方，看守在这里收存亡者的安息灯，低声诵读礼文，入夜后平台边缘挂着豆大的灯火
      崖壁冥想室: 嵌在崖壁里的住所与抄写室，看守轮班休息、抄录礼法的地方，窗户正对云海，白天短、夜晚长
      净化井: 崖间的一口井，井壁嵌着圣纹，能汲取并净化圣光，用于清洗器皿和举行净化仪式，井口常年飘着淡白色的光尘
