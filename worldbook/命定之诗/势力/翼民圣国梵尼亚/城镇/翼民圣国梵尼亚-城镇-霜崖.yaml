  霜崖:
    描述: 霜崖是圣仪院铸造圣具的工坊所在地。锻炉嵌在终年结霜的崖壁中，工匠从山顶引来冰泉，为刚铸成的器物淬火。每件圣具还要留在池中过夜，接受最后的霜冻检验。崖底冰封着一片古老的炉群，人们只能隔着冰层看到其中的拱架，始终找不到入口
    功能: 负责圣国重要器物的铸造、淬火与最终检验
    位置: 群山北侧常年结霜的背阴崖壁，冷泉从崖顶汇流而下
    概括:
      环境: 冰瀑从背阴的崖顶垂落，炉火的热气与冰泉的寒雾在工坊外相遇，崖边常有水汽弥漫
      建筑: 圣具锻造坊的入口悬挂着银霜家族的徽章，图案是一片覆着冰霜的银色羽毛。冰泉淬火池位于崖边，工坊宿舍紧邻工坊
      人文: 高阶圣仪官与圣具匠共同负责铸造和检验，灰帚家族承担净化仪式、器物清洁与日常维护。新的检验结果偶尔会被补记在旧工艺图册的页边
    地标: 圣具锻造坊，冰泉淬火池，工坊宿舍，冰封炉群
    地标详情:
      圣具锻造坊: 圣仪院设在崖壁中的铸造工坊，圣具匠在这里制作圣国的重要器物，技艺已传承多代
      冰泉淬火池: 工匠从崖顶引来冰泉，为刚铸好的圣具淬火。每件成品还要留在池中过夜，接受最后的霜冻检验
      工坊宿舍: 供轮班工匠住宿的房舍。灰帚家族的成员负责清洗器物、焚香净化，以及工坊的日常维护
      冰封炉群: 崖底被冰封的旧窑炉群，传说是圣律天穹核心的铸造地，冰面平整得像铸出来的一样，冰下排列着一排排拱架，无人进入过
