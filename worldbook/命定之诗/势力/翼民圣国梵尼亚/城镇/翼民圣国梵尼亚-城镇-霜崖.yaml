  霜崖:
    描述: 群山北侧背阴的崖壁，常年结霜，冰瀑从崖顶边缘垂落，冷泉从崖顶汇流而下。圣仪院的圣具锻造工坊嵌在崖壁里，圣国所有的重要器物都在这里铸成；圣具匠从崖顶引来冰泉进行冷淬，新铸的圣具必须在淬霜池里经受一整夜的霜冻检验，才算正式完成。匠师轮流清洗器物、焚香除尘。崖底的旧窑炉群被冰层封住，冰面平整得像铸出来的一样，冰下排列着一排排拱架，找不到任何入口
    功能: 圣仪院圣具锻造工坊，圣具冷淬与最终检验的场所，圣国的重要器物都出自这里
    位置: 群山北侧常年结霜的背阴崖壁，冷泉从崖顶汇流而下
    概括:
      环境: 崖壁常年覆盖霜雪，冰瀑垂落，炉火与寒气相接，冷泉从崖顶汇流而下，水汽弥漫
      建筑: 圣具锻造坊嵌在崖壁里，坊门上悬挂着银羽凝霜徽记，淬霜池设在崖边，净尘居紧挨着工坊，崖底的旧窑炉群被冰封，从未开启
      人文: 圣仪院的高阶圣仪官与圣具匠世代在这里铸造、冷淬、检验圣具，匠师轮流清洗器物、焚香除尘，负责净化仪礼与工坊杂务，偶尔会在旧图谱的边角补记新的检验结果
    地标: 圣具锻造坊，淬霜池，净尘居，冰封炉群
    地标详情:
      圣具锻造坊: 崖壁间的锻造工坊，圣具匠世代在这里铸造圣具，用冰泉冷淬，坊门上悬挂着银羽凝霜徽记
      淬霜池: 崖顶冰泉汇成的水池，新铸的圣具必须在池中经受一整夜的霜冻检验，才算正式完成
      净尘居: 匠师轮流值守的住所，负责净化仪礼与工坊杂务
      冰封炉群: 崖底被冰封的旧窑炉群，传说是圣律天穹核心的铸造地，冰面平整得像铸出来的一样，冰下排列着一排排拱架，无人进入过
