  月池屿:
    描述: 云海中的浮岛，岛形圆而浅，像一只盘子，直径约四百米，一半没入云海。岛中央凹下一汪静池，水池占了岛面的大半，池水清澈见底，没有水源却四季满盈，翼民叫它"月池"。满月之夜，翼民围着水池坐下，把心事讲给池水听，相信池水会记住，并随着月影沉入水底；平时也有翼民独自来这里静坐沉思。池边立着几尊低矮的石像，面朝水池中央，衣褶已经风化模糊，翼民叫它们听愿者，祈愿前要先向石像行礼。<秘密>圣造浮岛——古代构造体，位面战争时期的圣光能源装置，处于休眠且已损坏。岛中央的静池是装置顶部的冷却凹槽，池水由内部的冷凝结构循环供给。内部存有能源核心残骸与圣纹管线，深入探查也许能发现古代圣光工艺的遗存。</秘密>
    功能: 月夜祈愿/静思之地，翼民向池水倾诉心事的地方
    概括:
      环境: 浮岛安静，岛中央的静池没有水源却四季满盈，月夜池面像镜子一样，四周石像低伏，云海无声
      建筑: 池边没有房屋，只有石像环绕水池，池沿的石阶低矮平整，可以坐也可以靠
      人文: 翼民把静池当作倾听愿望的地方，满月夜祈愿的习俗最为盛行
    地标: 听愿像，静池
    地标详情:
      听愿像: 池边低矮的石像，面朝水池中央，衣褶已经风化模糊，翼民叫它们听愿者，祈愿前要先向石像行礼
      静池: 岛中央没有水源的静池，四季满盈不干，月夜倒映着月亮，像镜子一样；池底铺着石板，接缝笔直，一直延伸到池中央最深处
