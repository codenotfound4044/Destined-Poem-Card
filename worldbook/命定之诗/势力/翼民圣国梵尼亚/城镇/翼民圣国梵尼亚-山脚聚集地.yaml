  山脚聚集地:
    描述: 断崖脚下的前站，阶梯式市集与崖道交错重叠，朝圣者与商旅往来不断，灯火沿着山壁延伸
    功能: 朝圣前站/外族贸易/物流转运
    概括:
      环境: 云雾低垂，石阶与吊桥连接着各处驿站，夜里的灯火映在山壁上，风铃声此起彼伏
      建筑: 石木台地与临崖仓库并列，以驿站与货仓为主，临时搭建的翼棚随风摇晃
      人文: 外族商旅与本地搬运工混居，信仰朴素，贡品与货币同时流通，市场声音整日不断；朝圣者由圣务局外署引导走上山路，入夜后能远远望见峰顶圣纹的微光
    地标: 祈光驿站，天阶集市，朝圣者坞，风铃坡道，圣翼驮运台，云阶关，垂羽礼拜堂
    地标详情:
      圣翼驮运台: 空中货物交接平台，货队常驻
      云阶关: 进入山路的关口与收税站
      垂羽礼拜堂: 崖壁凹陷处的古老石砌建筑，彩绘玻璃窗向山谷投射出羽翼形的光影
