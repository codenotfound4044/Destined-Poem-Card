  曙峰:
    描述: 群山东侧边缘的一座山峰，每天最先迎来晨光，有山路与圣都相通。教义部、白羽谱库与白羽裁庭都设在这座山峰上，是管理教义、谱系与裁决的公共中心。峰顶的白石庄园、抄典坊与回廊错落分布，屋檐角上悬挂着金羽绕日徽记；抄写员亮出圣纹伏案抄写圣典，谱系官负责谱库的日常事务，翼民在这里抄写、校对、收藏和传播圣典。主殿台阶下的旧厅被锁着，四面墙上有成排被砌死的圆孔，是战时共同体当年议事的旧址
    功能: 教义部、白羽谱库与白羽裁庭所在，教义与谱系管理的公共中心
    位置: 群山东侧边缘的一座山峰，每天最先迎来晨光，有山路与圣都相通
    概括:
      环境: 峰顶最先迎来晨光，薄雾与朝霞在白石建筑间流动，山路盘绕，书卷的气味与山风混在一起
      建筑: 白石庄园与抄典坊在峰顶错落分布，回廊彼此相连，屋檐角上悬挂着金羽绕日徽记，主殿台阶下的旧厅紧锁
      人文: 教义部负责教义、谱系与裁决，谱系官负责谱库的日常事务，抄写员亮出圣纹伏案抄写圣典，这里的翼民以抄写、校对、收藏和传播圣典为业
    地标: 教义部庄园，抄典坊，曙晖台，战时旧厅
    地标详情:
      教义部庄园: 峰顶的白石庄园，教义部所在，每天最先迎来晨光，屋檐角上悬挂着金羽绕日徽记
      抄典坊: 抄写员在这里亮出圣纹伏案抄写圣典、誊录谱库资料，谱系官轮流在此值守，抄写的沙沙声比鸟鸣还早响起
      曙晖台: 峰顶的观日石台，巡礼者与山民常在这里远望圣都，教义部的钟声从这里传下山去
      战时旧厅: 主殿石阶下的旧厅，传说是战时共同体的议事场所，如今被锁着，四面墙上有成排被砌死的圆孔
