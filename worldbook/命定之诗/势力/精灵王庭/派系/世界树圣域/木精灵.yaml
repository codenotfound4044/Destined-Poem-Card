    木精灵(世界树圣域):
      派系定位: 王庭内的自治圣域派系，世界树的守护者与精灵信仰传统的核心
      管辖区域: 东部山林区(世界树林海腹地)、北部边境带(北方门户与湿地缓冲区)
      权力结构:
        性质: 与自然共生，守护森林
        领导层: 世界树的指引(主)与精灵长老议会(次)；现任首席长老奥兰迪尔，代表圣域列席王庭
        地方治理: 自给自足，与高精合作；北部边境带聚落兼理商队门户与界碑巡守
      阶级体系:
        核心: 无严格划分，在世界树之下人人平等
      军事:
        军队形态: 巡林客，鹰隼，林间诸兽与远古树精的结合集团
        特性: 依赖自然之力与炼金力量；战时接受王庭统一调度，平时自主巡护林海
      商贸:
        目的: 与外界友善沟通的手段
        货物: 精灵艺术品，草药与药水
        往来: 兽族联盟商队，以及北部边境带西北缘的矮人杂居聚落(以草药换取矿料、铁器与麦酒)
      外交立场(圣域自主保留):
        盟友/友好: 高等精灵(同源种族，共生羁绊)，兽族联盟(互有频繁交流)
        中立: 奥古斯提姆帝国(曾有捕奴行为，警惕对象)，梵尼亚(曾为战争盟友，众神离开后关系淡化)
        敌对: 黑暗精灵(精灵的背叛者)，萨赫拉联邦(历史仇怨)