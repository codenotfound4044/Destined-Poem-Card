      银帆同盟:
        定位: 以星冕港为中心的航海家族联合体，海巡龙舰舰队的骨干与海外殖民主导者
        据点: 星冕港(总部)、南部沿海带各港镇、海外殖民据点
        领导层: 盟主洛恩瓦斯(诸世家轮值推举)
        职能: 龙舰建造与海员输送，联合海防巡逻队(与索伦蒂斯王国)的王庭方主事，殖民航线开拓
        内部倾向: 海权与商路优先，维系现有殖民地，反对将舰队过度消耗于剿灭战
        与王庭关系: 效忠王庭但拥有雄厚财力与舰船，是宫廷必须笼络的现实力量
        外部关系: 与索伦蒂斯王国商界交谊深厚，新舰建造大量借鉴人类船型设计，以航速与实用取代古典巨构；视萨赫拉捕奴船团为头号海上死敌