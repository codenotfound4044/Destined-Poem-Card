    高精灵(王庭正统):
      派系定位: 精灵王庭的主体与正统，掌握王庭外交、海权与正规军事力量
      管辖区域: 中央平原区(王庭腹地)、西部海峡(面向大陆的门户)、南部沿海带(海权核心)、东南山海区(圣所与观星地)及海外殖民地
      权力结构:
        性质: 王庭在物质与精神上的支柱，保证王庭延续下去
        领导层: 凤凰王宫廷与永恒女王宫廷二元制
        地方治理: 原子化自治自足与地方组织辅助引导
        军备: 全民皆兵，公民兵役
      阶级体系:
        核心: 按对社会各行业的贡献划分，而不是按量化标准，晋升途径很多
        军队: 军功与魔法掌控力考核
        政治: 年限与贡献考核
      军事:
        核心理念: 精灵最先看见黑暗，也应当最后放下武器
        军队形态: 公民戍军，银叶军，宫廷卫队，魔导部队，海巡龙舰，巨龙和海巨兽等全面的军队组织
        特性: 军备先进，战术成熟，后勤稳定
        武备方针: 古代留下的巨舰与巨型兵器保留着"大即是美"的古典风格，但不再新建；新式工艺转向实用主义
      商贸:
        目的: 与外界沟通的渠道，精灵艺术品与奢侈品出口构成王庭最稳定的外汇来源
        货物: 精灵艺术品，民间武具炼金品，地方特产
      外交立场(代表王庭行使):
        盟友/友好: 木精灵(同源共生，保护对象)，索伦蒂斯王国(商贸伙伴，海上战友)，梵尼亚(同为神眷之国)
        中立: 奥古斯提姆帝国(曾有捕奴行为，现为一般贸易对象)，兽族联盟(联盟松散，对各派态度不同)
        敌对: 黑暗精灵(分离的堕落者，不死不休)，萨赫拉联邦(卑劣的奴隶掠夺者)
