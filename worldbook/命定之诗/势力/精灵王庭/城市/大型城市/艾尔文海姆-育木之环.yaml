  育木之环:
    世界树学环:
      定位: 木精灵最高学府(德鲁伊/草药/育林)，与卢泰西亚星辉学院、星辰崖天穹观星院并列王庭三大教育中枢
      布局: |
        环绕世界树支干的一圈活体讲环
        七座由巨木自然分叉育成的学枝，各授一门:育林、草药、炼药、驯兽、风语、塑木、归根
    巡林客营地:
      定位: 巡林客的集结与轮驻地
      职能: 平时自主巡护林海、守东部山林区古道；战时接受王庭统一调度
    鹰隼塔巢:
      定位: 育成于高枝的天然巢穴群，鹰隼军团的东部核心
      功能: 林海侦察、三维通讯、战时空中力量
    炼药露台:
      定位: 木精灵草药与药水的最高工坊