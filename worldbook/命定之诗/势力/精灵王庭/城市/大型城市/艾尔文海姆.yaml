世界树之城-艾尔文海姆:
  概览:
    定位: 木精灵世界树圣域的政治与经济中心，世界树信仰的发源圣地，位于东部山林区的林海深处
    选址: 东部山林区深处，坐落在世界树所在的中央谷地与环绕的山脊之间，依托巨木、山岩与地下水脉建成
    规模: 大型城市
    人口: 木精灵 | 远古树精 | 自然之灵 | 其他
    城市意象: |
      从远处看不见城市，只能看到一棵高耸入云、树冠遮天的世界树，树下是一望无际的林海；
      走进森林后才发现，巨木之间隐约亮着灯火，树屋挂在枝头，木桥在树冠间交织，树根间的洞穴透出微光，
      夜里世界树的叶脉会泛起淡淡的银光，像新月的光辉倾泻而下，这被称为树辉之夜
  任务层级: S级（世界树圣域）
  城市结构:
    世界树: 主干要数万人才能合抱，散发出的自然魔力让全城草木常青、伤者容易痊愈；据说树顶能碰到星辰
    第一环-根心圣域(树心):
      性质: 全城最神圣、不可侵犯的地方，只有德鲁伊和长老才能进入
      地理: 世界树主干底部与露出地面的主根群，根与根之间的缝隙里是天然圣泉
      核心建筑: 低语根隙，世界树主干
    第二环-长老之环(内环):
      性质: 圣域治理与信仰中枢
      地理: 世界树最粗壮的一圈支根与低层巨枝之上/之内
      核心建筑: 银冠厅，新月坛，忆藤书库，青帐使庭
    第三环-育木之环(中环):
      性质: 德鲁伊研习、育林、炼药与教育区(世界树学环所在)
      地理: 中层枝干与谷地缓坡
      核心建筑: 世界树学环，巡林客营地，鹰隼塔巢，炼药露台
    第四环-栖居之环(外环):
      性质: 木精灵日常聚居生活区
      地理: 谷地林间与外围坡地，居所依巨木散布
      核心建筑: 树屋，愈林园，诸兽栖谷，露泉集
    第五环-林缘之环(边环):
      性质: 圣城与外部世界唯一真正的连接处，树荫和魔力都在这里逐渐变得稀薄
      地理: 山谷城市的边缘，树荫逐渐稀疏的地方，连接东部山林区的古道网络
      门户:
        烁露林口方向: 通东部山林区/烁露林间，兽族联盟商队与草药贸易主道
        北向古道: 经北部边境带门户，接天镜湖湿地与北方旅人
        西南古道: 经中央平原区通往卢泰西亚