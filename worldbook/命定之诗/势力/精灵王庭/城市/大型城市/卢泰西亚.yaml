首都-卢泰西亚:
  概览:
    定位: 精灵王庭双宫廷所在地，半岛政治、奥术与礼法中枢，中央平原区的心脏
    选址: 中央平原区腹地，双辉河(源自东部山林区)与星落溪(源自东南山海区)交汇处的缓坡台地
    规模: 巨型城市
    人口: 高精灵 | 木精灵 | 人类 | 兽族 | 其他
    城市意象: |
      远望时，全城如一枚平放的七芒星冠——内环两座宫廷的金顶与银顶隔着星辰广场遥遥相对，
      日出时凤凰王宫廷的金顶先亮，日落后永恒女王宫廷的银顶映月
      白石基座+活木生长建筑；主干道两侧的魔法育林与建筑共生，百年老宅往往有半边墙壁是仍在生长的巨木
  任务层级: S级（王庭中枢）
  城市结构:
    内环-冠环:
      性质: 权力核心区
      地理: 全城最高的缓坡台地，双辉河与星落溪在此交汇后注入运河
      边界: 星辰运河环抱，运河内侧为白石城垣"银冕墙"，仅开四座礼门
      核心建筑: 凤凰王宫廷，永恒女王宫廷，艺术宫，星心广场，誓约庭，翠章庭，七芒圣殿，星辉学院
    外环-羽环:
      性质: 市民生活区，开放繁荣的日常之地
      边界: 外缘为活体魔法育林构成的"生垣"，嵌七座主城门
      地理: 环绕台地向四周平原舒展，果园与街区交错
      核心区划: 晨星区(北)，炬星区(东北)，澜星区(东)，穗星区(东南)，帆星区(南)，锋星区(西南)，弦星区(西)
    环间纽带:
      星辰运河: 宽约九十米的环形运河，同时具有河运、防御与星象观测功能