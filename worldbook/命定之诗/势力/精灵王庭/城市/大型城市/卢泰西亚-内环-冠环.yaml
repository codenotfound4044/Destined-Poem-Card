  内环-冠环:
    凤凰王宫廷(西侧宫廷):
      别称: 金羽之殿
      建筑风格: 白石与鎏金结构，正殿"焰冠厅"的穹顶装饰着展翅的金凤凰
      核心建筑:
        焰冠厅: 凤凰王处理政务与接见外国使节的地方
        凤羽议厅: 凤羽廷臣团的驻地，政令起草与颁布的实际中心，日夜灯火不熄
        选王厅: 凤凰王选举的法定场所，平时关闭，只在选举年开放
      驻守: 宫廷卫队西翼"金羽卫"
    永恒女王宫廷(东侧宫廷):
      别称: 星辉之殿
      建筑风格: 银白色石材与活树共生的结构，正殿"恒星厅"没有穹顶，靠魔法维持殿内四季无雨，夜晚可以仰望繁星
      核心建筑:
        恒星厅: 永恒女王处理政务与主持祭典的地方
        谱系塔: 恒星侍从院的驻地，收藏历代王室谱系与王位继承的法理裁定文书，塔内禁止用火，用星辉石照明
        观星回廊: 天穹观星院的分部，预言解读结果从这里呈报给女王
      驻守: 宫廷卫队东翼"银辉卫"
    星心广场(两座宫廷之间):
      定位: 全城几何布局与政治的双重中心
      核心建筑:
        - 广场中央立着一棵用世界树枝条培育的银叶树，与一根金凤凰浮雕石柱相互缠绕生长
        - 艺术宫: 永久陈列王庭历代收藏的奥术造物、星辉画作与战争纪念品，向全体精灵公民开放，被誉为承载千年记忆的白石长廊；东廊陈列古精灵时期的古典巨作，西廊是复兴纪元以来的淡色系新作，就像一部可以亲手触摸的精灵美术史
      功能: 重大国家典礼、两位君主共同颁布诏令、对黑暗精灵的缺席审判都在这里举行；长老议会列席王庭会议时，木精灵使团的青色帐篷就搭在银叶树旁
    四庭:
      星辉学院(北庭):
        定位: 高等奥术、星象与政务教育的中心，星辉学塔的大本营
        布局: 七座学塔环绕着中央大讲堂，地下是封存禁咒的仓库"缄默穹窖"
      七芒圣殿(南庭):
        定位: 星辰与自然双重崇拜的最高神殿
        布局: 神殿分为七个大厅，对应七芒星的七个尖角，中庭的露天圣池引入双辉河的活水；冬至"星降节"时全城熄灭灯火，只有圣池倒映着星空
      翠章庭(东北庭):
        定位: 王庭档案馆与外交使馆区；索伦蒂斯王国与梵尼亚的常驻使馆都在这里
      誓约庭(西南庭):
        定位: 龙誓骑团在内环的联络处与荣誉厅，陈列着历代龙骑士留下的铠甲；骑团本部实际上在城郊的誓约校场
