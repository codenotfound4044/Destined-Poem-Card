  外环-羽环:
    总述: 七条放射状主街把外环分成七个城区
    晨星区(北):
      性质: 陆路商贸区，面朝北部边境带与天镜湖湿地方向
      要点: 北门"曙光门"是陆上商队的主要入口；木精灵草药与药水最大的集散市场"青露市"就在这里；也是兽族联盟商队的指定歇脚区
    炬星区(东北):
      性质: 工坊区
      要点: 民间武器装备与炼金品工坊聚集，星辉学院的学徒常在这里接私活
    澜星区(东):
      性质: 河运码头区
      要点: 双辉河码头，东部山林区的巨木与山货经水路运抵王都
    穗星区(东南):
      性质: 农产品市场与仓储区
      要点: 中央平原谷物与水果的集散地，王庭储备粮仓所在；战时的后勤总仓库
    帆星区(南):
      性质: 南路商贸区
      要点: 通往南部沿海带与白焰港的大道起点；银帆同盟在王都的商会会所"银帆邸"就在这里
    锋星区(西南):
      性质: 军务区
      要点: 正规军的王都驻军大营、公民戍军操练场、征兵处；出城一公里多就是龙誓骑团的誓约校场，晴天能看到巨龙起降，这个城区的房价因此最低，酒馆生意也因此最好
    弦星区(西):
      性质: 艺术与高级住宅区
      要点: 精灵艺术品工坊、音乐厅与剧场聚集；通往西部海峡与星冕港的大道起点；退休的宫廷官员与老学者大多住在这里，是全城流言与政治议论的发源地。改革派的抨击文章、鹰派的哀歌，在同一间音乐厅里流传
    生垣与七门:
      生垣: 外环边缘由活树培育而成的城墙，高逾三十米，平时枝叶稀疏，像一片林荫，设有税关与哨塔
      七门: 曙光门(北)、炬火门(东北)、澜川门(东)、金穗门(东南)、扬帆门(南)、砺锋门(西南)、流弦门(西)
