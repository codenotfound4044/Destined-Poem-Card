沉月城:
  概览:
    定位: 永夜深海中的幽影明珠，至高家族在无尽海上的王座，暗魔法与异神信仰的沉淀之地
    选址: 坐落于无尽海深处的黑曜石海沟边缘
    规模: 庞大城邦 | 诸多家族定居点
    人口构成: 各族奴隶50% | 暗精20% | 其他30%
    城市意象: 城市上空常年笼罩着巨大的“蚀光结界”以保护城市，主干道两侧没有植物，只有用深海巨兽石化骨骼雕刻而成的引路柱。建筑边缘极度锋利，极少有弧线
  城市结构:
    苍白之脊:
      性质: 权力与奢靡的绝巅，高阶术士与贵族的沉梦之所
      地理: 高耸于海面之上的陡峭断崖，终年缭绕着散不去的凄冷海雾
      风貌: 被蚀光幽幕温柔地包裹，外缘是荆棘般的黑曜石高墙，仅开一扇“沉星之门”，用以迎接归来卸下战利品的黑方舟
    沉月之眠:
      性质: 混沌与欲望的灰烬地带，法外狂徒、异族走私者与没落贵族的交汇之所与销金窟
      地理: 镶嵌于断崖与深海交界的宽阔大陆架上
      风貌: 潮湿而错综复杂的岩洞与悬空步道交错。空气中永远弥漫着异域香料、陈年海风与淡淡血腥混合的奢靡气息
      生态: 无论是来自索伦蒂斯的走私火器、伯伦斯法环罕见的魔法遗物，奥古斯提姆的纯良奴隶，甚至是家族斗争中失败的落魄主母，都可以买到
    下无光之渊:
      性质: 庞大的财富沉淀地与暗影魔力的无底漩涡。
      地理: 向海平面以下无限延伸，直接与冰冷的深海暗流相融
      风貌: 外围没有城墙，只有潜伏在黑水中的庞大海妖，如阴影般守护着这片死寂的领地。错综复杂的地下水路与岩洞如迷宫般交织，将所有的绝望、血泪与掠夺来的连城珍宝，悉数垂葬在最深处的黑暗里

  特殊地点:
    堕渊肉林: 战败家族的眷属与高阶异族奴隶在此被彻底物化，沦为权贵与海盗们发泄暴虐欲望的堕落之地
    腥血角斗场: 每天吞噬无数奴隶与凶暴魔兽的残酷血肉磨盘，用极致的物理厮杀与喷涌的鲜血为看台上的贵族与尊贵客人提供最原始的娱乐
    蚀心炼金所: 终日弥漫着致幻神经雾气的蚀界车间；贵族们在此批量萃取用于政治刺杀、洗脑控制以及强行榨取奴隶潜能的致命致命药剂
    海巨骸造船坞: 依托深海巨兽骨架建立的庞大重工业据点，数万耗材在皮鞭下日夜拼装黑木与铁甲，源源不断地为舰队输出用于劫掠的海上堡垒

  任务层级: A级（最高）
  生命层级: 5(其它家族主母&首席战士)/4(外来者&家族超凡者)