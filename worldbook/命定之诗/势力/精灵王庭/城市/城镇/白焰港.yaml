城市-白焰港:
  概览:
    定位: 精灵王庭南部沿海带的第一军港与远洋贸易门户，海巡龙舰舰队南方母港，海权投射的南方起点
    选址: 南部沿海带中段，一处深水避风的弧形海湾，两道黑色礁岩岬角如臂环抱，湾口有天然礁岛可扼守航道
    规模: 大型港市 | 军民复合型海滨城市
    人口构成: 高精灵海军及军眷35% | 高精灵航海家族与船工20% | 商贸民与码头劳力20% | 木精灵驻港草药师与林产商5% | 索伦蒂斯侨商及外族水手10% | 其他10%
    城市意象: |
      远航归来者最先望见的，是湾口礁岛上那座昼夜不熄的白焰灯塔
      白石塔身高逾六十米，塔顶魔法白焰经久不灭、风雨不侵，夜航者称其为"南天第二星"；
      入湾后，弧岸铺展，白石码头如新月托海，海巡龙舰的银灰舰体列泊军港，
      商港桅樯如林，坡上树灯次第亮起，与港灯连成一片，映得整片海湾泛着乳白微光
  城市结构:
    军港带(西湾-背风深水区):
      性质: 海巡龙舰舰队南方母港，非军籍不得入的禁泊区
      要点: 深水泊位与干船坞；巨舰维修、补给、军械封存；西岬角设"焰角堡"扼守湾口
    商港带(东湾-向阳浅水区):
      性质: 远洋与沿岸商港，全境最繁忙的南方海市
      要点: 客货码头、渔市、税关；银帆同盟"南帆商馆"设在这里；索伦蒂斯商船常泊
    城区带(弧岸台地):
      性质: 市民聚居与行政、造船核心区
      要点: 港务厅、造船工场、水手行会与远航者聚居；新式造船借鉴人类船型
    坡林带(滨海丘陵):
      性质: 雅居、疗养与守望区
      要点: 退役海员与船东宅邸；坡顶哨塔与风塔；望海果林
  湾口与灯塔:
    白焰灯塔(礁岛): 湾口天然礁岛上的白石巨塔，塔顶白焰为永恒女王宫廷所祝圣的不灭魔法火，兼作导航、观象与湾防信标；焰色转红即为战时警讯
    焰角堡(西岬): 扼守湾口的白石海防要塞，架设魔导床弩与信号焰台，与灯塔互为犄角
    双臂岬礁: 东西两道黑礁岬角天然环抱海湾，礁隙暗流仅本地引水人熟稔，是天然的水下屏障
  任务层级: A级（南方军港）