城市-星辰崖:
  概览:
    旧称: 群星栖落之阶
    定位: 精灵王庭星象与预言中枢，天穹观星院本部所在，东南山海区最接近群星之地
    选址: 东南山海区最高山脊末端，一道自山巅直落入海的巨型阶状悬崖之上
    规模: 中型圣所城镇 | 学术-祭祀定居点
    人口构成: 高精灵星象士与风语者45% | 木精灵德鲁伊访学者15% | 恒星侍从院祭司10% | 驻军与鹰隼骑手15% | 学徒与勤务民15%
    城市意象: |
        自海上远望，星辰崖如一柄插入云海的银色阶梯
        山麓林木葱茏，中段石阶与悬桥没入常年缭绕的云雾，
        峰顶的观星台群则浮于云海之上，白昼可见云瀑倾泻崖壁入海，
        入夜后星轨低垂，仿佛伸手可触，观星院的星辉石灯与天穹连成一片，
        分不清何处是灯、何处是星，故称"星海不分之夜"
  任务层级: A级（星象中枢）
  城市结构:
    星阶:
      性质: 天穹观星院最高圣所，星辰祭祀与大预言之地
      位置: 最高且最窄的崖顶平台，常年处于云线之上，仅一条蜿蜒石阶与下方风阶相连
      地理: 裸岩台地，三面绝壁临空，北面唯一石阶入口
      核心建筑:
        天轨祭坛: 露天银岩盘本身即为祭坛，星降节、月蚀祭与大预言仪式在此举行；恒星侍从院在这里向永恒女王呈报最高等级的星兆解读
        七星仪柱: 环立台地边缘的七座观星柱，各对应一颗精灵星历中的导航恒星；柱间以铭文弧线相连，构成精灵已知最精密的露天星仪
        鹰塔群: 嵌入崖壁最高处的三座悬空石巢，鹰隼军团东南山海区分驻点；担负星阶安全警戒、紧急星兆传讯与高空气象观测
    风阶:
      性质: 天穹观星院主体所在，星象研究、风语训练、典籍保存与恒星侍从院分坛集中区，星辰崖的实际运转中枢
      位置: 中段宽阔台地，由数块天然岩阶拼合而成，面积为星阶的十倍以上；上接星阶石径，下通雾阶主道
      地理: 台地北侧紧贴山脊，南侧凌空俯瞰云海与远方海面；一道窄瀑自山脊上方引流而下，穿过风阶注入崖壁裂隙
      核心建筑:
        天穹观星院本殿: 风阶最大的单体建筑，半圆形白石厅殿嵌入山壁，日常星象记录、星轨推演、潮汐预测、新学徒的观星启蒙；院长于此主持院务
        恒星侍从院分坛: 隐入山壁的冥想室群，入口以银纱帘与铭文封印标识，永恒女王宫廷派驻星辰崖的常设祭祀与预言解读机构
        学舍与典籍库: 风阶东侧的石砌建筑群，学徒宿舍、风语者训练场、星象图书馆与古籍典藏室
    雾阶:
      性质: 星辰崖的世俗生活基底与物资转运枢纽，居民聚落、驻军营地与通往内陆的交通节点
      位置: 最低台地，与内陆山道衔接
      地理: 数块相邻岩阶与山谷缓坡拼合而成，有少量可开垦的薄土与溪流灌溉的梯田
      功能: 居民聚落、日常生活、物资转运
