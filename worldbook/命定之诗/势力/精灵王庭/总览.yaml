---
势力-精灵王庭(卢森提亚):
  概览:
    定位: 曾主导大陆文明秩序的古老精灵王庭，如今以半岛为最后疆域，在衰落与复兴之间悬而未决
    疆域: 半岛全境、近岸岛屿及海外殖民据点(殖民政策搁置，现有殖民地仍在维系)；对暗澜群岛保有法理声索(实际由叛离的黑暗精灵盘踞)
    标识: 七芒星冠之下，金色凤凰环抱银色世界树
    首都: 卢泰西亚(中央平原区，凤凰王宫廷与永恒女王宫廷所在)
    统治者: 凤凰王与永恒女王共治，世界树长老议会列席
    历史地位: 精灵是阿斯塔利亚文明的长子
    精灵与矮人的渊源: 第二次位面战争后矮人的故国覆灭，部分矮人迁到靠近龙脊山脉、紧邻王庭北部边境的过渡地带，与精灵混居共处
    信仰: 星辰与自然双重崇拜(主流)，世界树信仰(木精灵)，蚀界崇拜(黑暗精灵-被判为异端)
    文化霸权: 即便军事与人口已不复鼎盛，精灵语仍是大陆外交与学术界的通用语言；贵族以收藏精灵艺术品为身份象征
    历史分期:
      古精灵时期: 漫长的和平让精灵脱离了直接生产，用近乎无限的时间打磨技艺，形成了古典、精雕细琢、华美而缓慢的审美
      第一次位面战争后: 局势剧变，古典审美进入过渡期，旧式的宏伟与新兴的实用相互拉锯
      复兴纪元: 与矮人、人鱼及其他种族的交流越来越深，工坊与港口逐渐取代了过去纯粹的艺术殿堂
    主要威胁: 黑暗精灵海上袭掠(延续千年的内战)，萨赫拉联邦捕奴船团；奥古斯提姆帝国(非敌非友的新兴陆权)
    重要城市: 艾尔文海姆(世界树之城)，星辰崖，白焰港，眠根谷，沉月城(黑暗精灵)，黑方舟(黑暗精灵)
    重要关口与海峡: 曙光瞭望(北部边境带/通天镜湖湿地的北方门户)，烁露林口(东部山林区/通烁露林间)，星冕港(西部海峡/对克摩什大陆航渡枢纽)
    教育:
      星辉学院(卢泰西亚): 高等奥术/星象/政务
      世界树学环(艾尔文海姆): 德鲁伊/草药/育林
      天穹观星院(星辰崖): 星象/预言/风语
    军事:
      陆军: 公民戍军与银叶军，辅以宫廷卫队、魔导部队；木精灵巡林客与远古树精
      海军: 海巡龙舰舰队，联合海防巡逻队(与索伦蒂斯王国共建)
      特殊战力: 巨龙，海巨兽，鹰隼军团