  政治与社会:
    权力结构:
      结构: 二元宫廷联合王庭；凤凰王宫廷(选举)与永恒女王宫廷(世袭)共掌军政与祭祀，木精灵以世界树圣域自治体身份加盟，黑暗精灵为在册叛离派系
      领导层: |
        凤凰王艾尔瑞安
        永恒女王塞蕾诺亚
        世界树指引下的精灵长老议会享有圣域事务否决权
      地方治理: 各地聚落原子化自治自足；东部山林区与北部边境带由木精灵依传统自理；北部边境带西北缘靠近龙脊山脉处有第二次位面战争后迁来的矮人杂居聚落
    阶级体系:
      社会阶层: 按社会行业贡献度划分；军队以军功与魔法掌控力考核，政务以年限与贡献考核
    三大派系:
      高精灵(王庭正统): 
        概览: 管辖中央平原区、西部海峡、南部沿海带、东南山海区及海外殖民地
        纹章: 展翼金凤与七芒星冠
        内部派系: 凤羽廷臣团,恒星侍从院,龙誓骑团,星辉学塔,银帆同盟
      木精灵(世界树圣域):
        概览: 管辖东部山林区、北部边境带，现任首席长老奥兰迪尔
        纹章: 世界树银冠与新月
      黑暗精灵(叛离派系):
        概览: 盘踞外海暗澜群岛与黑方舟移动舰城，现任至高家族主母萨雷菈
        纹章: 黑色方舟与断裂的星冠
        内部派系: 至高家族,次席家族同盟,碎星市
    主要诉求:
      消灭叛离者/夺回正统: 剿灭黑暗精灵海上军事体系，收复暗澜群岛/重回大陆
      海权与商路: 依托联合海防巡逻队维护合法海贸航线，维系现存殖民航线
      守护世界树: 保全自然魔力之源。庇护阿斯塔利亚，及更广阔的世界
      未名之问: |
        弦星区的沙龙里，年轻的精灵开始问一个老人们拒绝回答的问题："复兴"这个词，为什么不能也是我们的？