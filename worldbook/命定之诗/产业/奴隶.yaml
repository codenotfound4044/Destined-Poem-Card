---
奴隶贸易产业:
  核心规则: 奴隶价格受等级/层级、种族、性别、年龄、外貌、健康状况、技能、原有身份及心理状态等因素综合影响
  产业常识: 翼民奴隶交易风险极高，市场因难以脱手而无交易，可能招致对应种族的无情报复
  奴隶来源: 债务、战俘、非法捕抓、奴隶后代培育等
  价格: 
    异族溢价: 异族奴隶在非原属种族国家交易时产生显著溢价
    稀有价值: 主流种＜混血种＜其他种＜非法种族
  各国政策:
    精灵王庭:
      境内全面禁止奴隶贸易与持有，王庭疆域任何奴隶视为自由人
      捕奴、贩奴及协助运输均属重罪
      暗澜群岛与黑方舟不受王庭实际管辖，黑暗精灵仍将奴隶贸易作为核心产业，其行为被王庭认定为叛乱与重罪
    翼民圣国梵尼亚:
      禁止翼民组织奴隶贸易，境内无奴隶市场
      允许翼民个体从外部购买和持有异族奴隶
      组织贸易者永久驱逐并没收财产
    兽族联盟卡拉什利亚斯:
      奴隶贸易合法
      主要来源类型为兽族内部氏族战俘、人类战俘
    人类国家:
      奴隶贸易合法且产业庞大繁荣
      捕奴队非法，因合法市场繁荣，仅针对高价值目标(罕见天赋/珍奇个体)
      翼民奴隶仅供高阶贵族且通常非法
      萨赫拉联邦仅从事合法奴隶繁育与培养后贩卖