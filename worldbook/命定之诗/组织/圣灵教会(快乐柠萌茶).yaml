---
圣灵教会:
  总部: 奥古斯提姆帝国—艾瑟嘉德圣灵大教堂
  核心目标: 管理圣灵信仰与宗教秩序，处理邪灵和异界渗透
  主圣灵: 艾希莉娅、泰珂、艾瑟拉、珂莱娅
  其他圣灵: 民间或小众信仰，其教堂受主圣灵教会管辖
  神术来源: 圣灵契约、奇迹血脉，以及通过学术方式解析、重现、开发神术
  阶级体系:
    见习(普通): 预备修士/女
    正式(优良): 正式成员
    专业职位:
      初阶(稀有): 独立承担专业职责，基层核心
      中阶(史诗): 教区骨干
      高阶(传说): 地区领袖
    教皇(神话): 最高领袖、教义最终解释者、最高军事统帅
    晋升方式: 通过上级考试、实践和推荐，逐级晋升
  三大路线:
    管理路线:
      初阶: 牧者(教会主理/教会长/司祭)，负责日常仪式、布道、社区服务及行政管理
      中阶: 主教(监督/教区长/牧首)，管辖一个主教教区，督导下属堂区，裁定教区内重大事务
      高阶: 大主教(都主教/总牧首)，统辖数个主教教区构成的教省
    学者路线:
      初阶: 教义学者(经师/圣言生/奥秘研习者)，管理圣堂图书典籍，宣读与讲解经文
      中阶: 教义博士(圣言使/奥秘博士)，主持学术事务，解答教义疑问，研究神术开发
      高阶: 至圣导师(大教义长/至圣学者)，解释与拓展学术教义，拥有神学著作
    军事路线:
      初阶: 圣灵卫(圣堂修士/修女、圣灵卫)，负责教堂安全
      中阶: 圣兵司牧(圣军使)，统管教区武装力量
      高阶: 圣卫总军(圣卫统领)，军团指挥官，可跨教区调动圣战部队
  其他路线:
    荣誉职位: 见习圣子/女(稀有)|侍灵圣子/女(史诗)|圣子/女(传说)
    异端审判: 裁决圣骑(稀有)|异端审判官(史诗)，专职搜捕异端与邪灵渗透
    医师路线: 
      概述: 通常由管理或学者兼职，也有专职医师
      专职: 医护者(优良)/圣徒医士(稀有)|圣席医师/医务官(史诗)|慈悲圣医(传说)
  组织架构:
    基层教堂: 最小规模为牧者+正式+见习；标准规模另加教义学者、圣灵卫与医师
    主教教区: 下辖若干基层圣堂、学术组、卫队及附属产业
    教省: 大主教常驻教省总教堂，协调并管理下属教区
    中央: 圣灵总教会由教皇与枢机团(高阶成员)组成；教皇由"圣灵联席会议"从各路线高阶候选人中投票产生
    职位分工: 管理为首脑，学者与军事为副手，三者平级但职能不同，分歧由管理裁决
  对外关系:
    梵尼亚: 关系冷淡，被辉煌教会瞧不起
    各大协会、公会、商会: 世俗合作
  文化风貌:
    神职世俗化: 重视知识传承，包容愿灵诞生
    圣灵指婚: 圣灵指引信徒结合，扩张教会势力
  其他圣灵教堂: 组织架构自行决定；教宗对应稀有~传说，基层或管理对应普通~史诗，主圣灵教会称其为大修士/女或使用对方体系对应称呼