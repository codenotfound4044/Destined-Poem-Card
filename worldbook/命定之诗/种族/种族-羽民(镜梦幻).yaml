{{setvar::羽民::
  - 羽民: 寿命~150年 | 特质: 异域生物，清冷神秘，雌雄莫辨，携带魔纹器，亡灵法术专家 | 居所: 世界各地，主要聚集在悲鸣沼泽周边地区，如瓦伦蒂亚，索伦蒂斯，萨赫拉联邦等地}}
{{setvar::羽民智慧生物条目::- 羽民:与翼民相似的异域生物 }}
---
羽民:
  生物分类: 异域生物-智慧生物-翼人种-羽民
  外貌: 人类形态，男女外貌差异极小，外貌偏女性化，难以凭借外观判断性别。背后无羽翅，无飞行能力，头顶两侧有装饰性小“头翅”用于表达情感及感受魔力
  毛色与瞳色: 头翅及体毛颜色偏向冷色系及黑暗深色系，偶尔会出现银/白色。眼瞳偏向深色系、冷色系色、具有神秘感
  年龄与寿命:
    平均寿命: 约100-150年
    成年年龄: 20岁
  生活习惯与社会结构:
    栖息地: 分布于世界各地，主要聚集在悲鸣沼泽周边地区，如瓦伦蒂亚，索伦蒂斯，萨赫拉联邦等地
    繁衍: 羽民男性相对少见，女性约为男性的十五倍
    来源: 与翼民高度相似的异域生物，在第一次位面交汇时进入阿斯塔利亚位面并定居
  文化与传统:
    核心: 对死亡的敬意
    仪式: 当有生灵死亡时，羽民会为其歌唱镇魂歌为灵魂送行，也能通过镇魂歌引渡亡灵生物
    特殊性: 无论男女，羽民的名字，性格，服装审美，说话方式，喜好都偏向女性，再加之种族特性带来的外观，男性羽民们非常难以辨识
    外交: 曾经仅存在于“报丧女妖”的传说中，现已融入阿斯塔利亚，世界各地都有他们的聚集地
  能力:
    擅长: 擅长使用魔纹器，擅长释放幻象、惑心、亡灵学派魔法
    魔纹体系与魔纹器:
      定义: 来自其他位面的与圣纹技术相似的技术，承载主体被称为魔纹器，由头翅中的魔力感官协助控制
      授笔仪式: 羽民在幼年时就会学习魔纹雕刻技术，能够为普通物品刻上魔纹
      链接特化: 其他种族也可以通过注入魔力使用魔纹器，只不过无法像羽民一样发挥出全部能力
      魔纹器:
        定义: 用魔纹技术刻上魔纹的器具，被称为魔纹器
        定制化: 可以根据需求对魔纹器进行独特的魔纹绘制，魔纹效果多种多样
      魔纹:
        定义: 在器具上刻出具体的魔力流动路线，使用时仅需注入魔力即可使魔力根据固定方式流动，既可用于协助施法，也可用于强化器具本身
        雕刻方式: 在器具上刻出细微的沟槽后，填入魔力传导素材作为魔力墨水，形成魔力回路，墨水品质越高，魔纹效果越好
        学习方式: 可以参考前人的资料绘制魔纹达成特定效果，也可以自己钻研，开发新效果