  - 黑角民: 寿命50-60年 | 羊族亚种/部分返祖(恶魔特征)/极度禁欲/稀少 | 居所: 隐居在各地山脉}}
---
黑角民:
  生物分类: 智慧生物-亚人-兽族-羊族亚种
  外貌: 肤色偏白，身材纤细，无论男女容貌都很精致。自称“艾普迈斯”，意思是“受诅咒的我们”。头发多为黑色或白色，蓬松；瞳孔是漆黑的横向长方形，羊角又大又形状各异，有一条短羊尾
  返祖诅咒: 半数族人受到返祖影响，表现各不相同，比如长出细长的恶魔尾巴、双腿变成羊蹄、角变大、皮肤变黑
  寿命: 约50-60年，15岁成年
  习性:
    栖息地: 以小型聚落的形式隐居在山中
    饮食: 采集植物生吃，不受植物毒素影响
    繁衍: 通常一胎只生一个，孕期和分娩都极短；虽然性欲极强，却极度禁欲，性行为受族群规则严格限制，一生通常只有两次必要的繁衍
  文化与结构:
    社会结构: 由智者组成长老团，培养下一代，并从中挑选年轻的头羊来带领族人
    价值观: 对内极度团结包容，对外极度排外
    对外关系: 即使受到种族迫害，价值观依然端正，只会逃离或在必要时自保，从不走向狂热
    庆典: 新人结合、为族群延续血脉时，全聚落的人都身穿白衣、头戴花环，在盛开的花海中举行神圣的庆典
  能力:
    灵活性: 无论体型和年龄，灵活性都极高，可以在岩壁上随意攀爬跳跃
    黑魔法: 以献祭自身生命力为代价的“黑魔法”与“诅咒”，只在遇到无法逃离的危险时用来自卫
  历史与现状:
    历史: 第二次位面战争中，部分羊族部落被困在重灾区，遭到恶魔诅咒；先祖喝下了异神污染的水，换来了在恶劣环境中生存的体质与黑魔法
    发展: 血脉被永久扭曲，为了防止族人堕落成魔物、保护受到敌视的同胞，先祖定下了严格的禁欲戒律与避世原则
    现状: 几百年的自我净化让返祖诅咒逐渐减弱，族群发展成极其团结的群居种族，遇到外族会本能地逃跑；由于外貌像恶魔，又背负着“诅咒”的传闻，被视为不祥之物