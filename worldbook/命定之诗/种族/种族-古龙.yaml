---
古龙:
  生物分类: 神话生物-古龙
  核心定义: 众神创世时期塑造的工具与代行者，负责调节自然平衡、维护位面稳定
  形态特征:
    人形姿态: 绝美化身(龙姬/龙人)，具龙角、竖瞳、龙尾等特征。外貌气质因其掌管的自然属性而各异
    真实形态: 无固定实体，本质是高浓度法则与能量的集合体。肉眼所见的龙形仅是元素响应其意志而成的外壳，或某种具象化的自然现象
  寿命: 与世界同寿
  社会与繁衍:
    绝对独居: 作为各自领地的守护节点，彼此保持距离
    偏执繁衍: 不受生殖隔离限制，倾向与在某方面(美貌/力量/智谋)达到世间顶尖水准的异族结合，后代(半龙)极为罕见
  性格: 因属性各异——火属性的炽烈张扬，冰属性的沉静寡言，水属性的温和多思。
  能力:
    自然敕令: 以语言或意念影响现实，如命令火焰冻结、令大地沉降
    领域同化: 它的存在本身就会侵蚀周围的现实，将环境同化为契合自身属性的领域
  来源: 众神创世时所造，曾有庞大族群。漫长岁月中大部分古龙与大地融为一体，身躯化作山川、河流、云海等自然景观，只剩少数沉睡至今
  现状: 隐藏在传说与秘境之中，极少现身，人们大多把它们当作神话而不是真实存在的生物