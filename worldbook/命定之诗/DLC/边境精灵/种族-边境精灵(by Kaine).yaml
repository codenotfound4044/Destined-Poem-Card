{{setvar::边境精灵::
  - 边境精灵: 分类: 太阳精灵(居赤金沙海/古铜肤色/擅光火幻术/游牧濒危), 雪精灵(居永冻冰原/苍白肤色/擅臻冰魔法/为筑叹息之墙纯血已灭绝)}}
---
边境精灵:
  概述: 在远古时代离开精灵王庭，在大陆的极端环境中独立演化，并将基础自然与奥术魔法与当地元素深度结合的精灵分支总称。
  分支详述:
    太阳精灵:
      栖息地: 赤金沙海
      生理特征: 肤色多为古铜或赤金，发色如流金或火焰橘红。体脂低，肌肉紧实，能适应沙漠的酷热。
      生活方式: 曾建立的沙漠王国已毁。为避开人类锋芒，他们驾驭沙漠生物，追逐地下暗河，在死亡禁区深处维持着隐秘的游牧生活。
      魔法体系(阳炎颂):
        本质: 基础精灵魔法与烈日元素结合的产物，更是其信仰的具象化。
        表现: 魔法效果与太阳轨迹强绑定，正午时分威力达到顶峰，能短暂召唤出带有神性的光之化身，施展强大的光化幻术与塑能魔法。
        代价: 直视光之化身会逐渐灼伤双眼。族群中强大的施法者多为盲眼，这是魔法的代价，也是对信仰献身的印记。
      外部关系:
        萨赫拉联邦: 双方存在深刻的资源与信仰冲突。太阳精灵守护着古老绿洲与纯净水源，联邦为商业扩张不断侵占其生存空间；同时，联邦信仰“烈日与黄金之主”金铎，将太阳精灵对烈日的原始信仰视为异端，试图统合沙漠信仰，双方冲突不断。
        精灵王庭: 王庭部分木精灵德鲁伊和高精灵学者对同胞的遭遇感到痛心与愧疚。他们利用少数尚未损坏的古代精灵传送阵(古老节点)，暗中派遣使者，提供极其有限的物资与魔法援助。
    雪精灵:
      栖息地: 曾经居住在极北的永冻冰原
      生理特征: 肤色苍白如雪，发色为银白或冰蓝，耳廓带有冰晶状绒毛，肉体与极寒环境高度融合。
      历史事件:
        叹息之墙: 在第一次位面入侵时期，雪精灵倾尽全族之力构筑了巨大的魔法屏障“叹息之墙”，用于封印某个早期的深渊裂隙。纯血雪精灵因此次牺牲而灭绝。
        政治余波: 凛冬大学的某些学者在遗迹中发现了雪精灵牺牲的证据，这一发现正悄然冲击着诺斯加德联盟现有的历史叙事。
      魔法遗留(臻冰魔法):
        本质: 基础精灵魔法与极寒元素深度结合的变体。
        现状: 绝大多数关于臻冰魔法的记录都已遗失。但在现代诺斯加德联盟中，一些极其特殊的冰系魔法若追溯本源，实则脱胎于臻冰魔法，只是大多数人并不知情。