name: Workspace verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**/*.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**/*.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.17.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pnpm setup:workspace
      - run: pnpm refs restore
      - run: pnpm verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-and-unpublished-candidate
          path: |
            dist/
            .cache/verification/
          if-no-files-found: ignore
          include-hidden-files: true
